    #__bundler_loading { position: fixed; bottom: 20px; right: 20px; font: 13px/1.4 -apple-system, BlinkMacSystemFont, sans-serif; color: #666; background: #fff; padding: 8px 14px; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.12); z-index: 10000; }
    #__bundler_thumbnail { position: fixed; inset: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #faf9f5; z-index: 9999; }
    #__bundler_thumbnail svg { width: 100%; height: 100%; object-fit: contain; }
    #__bundler_placeholder { color: #999; font-size: 14px; }
  </style>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

efd17a83fce\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Source Serif 4';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"57648a58-ee28-4174-bfb6-e8a2e4a1ba9a\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n:root {\n  --color-bg: #f3f2f2;\n  --color-surface: #eae9e9;\n  --color-text: #201e1d;\n  --color-accent: #0088b0;\n  --color-accent-2: #d6006c;\n  --color-divider: color-mix(in srgb, #201e1d 16%, transparent);\n\n  /* Tonal ramps — generated in OKLCH on one shared lightness scale, so the\n     same step of any role matches the others in visual value. */\n  --color-neutral-100: #f8f4f4;\n  --color-neutral-200: #eae7e7;\n  --color-neutral-300: #d7d3d3;\n  --color-neutral-400: #bab6b6;\n  --color-neutral-500: #9b9797;\n  --color-neutral-600: #7d7979;\n  --color-neutral-700: #605d5d;\n  --color-neutral-800: #444141;\n  --color-neutral-900: #2d2b2b;\n\n  --color-accent-100: #e9f8ff;\n  --color-accent-200: #cbeeff;\n  --color-accent-300: #99e0ff;\n  --color-accent-400: #62c5ee;\n  --color-accent-500: #38a6cf;\n  --color-accent-600: #1186ac;\n  --color-accent-700: #006786;\n  --color-accent-800: #004961;\n  --color-accent-900: #0a303e;\n\n  --color-accent-2-100: #fff1f4;\n  --color-accent-2-200: #ffdee6;\n  --color-accent-2-300: #ffc0d0;\n  --color-accent-2-400: #ff90b1;\n  --color-accent-2-500: #ff458e;\n  --color-accent-2-600: #d82071;\n  --color-accent-2-700: #aa0b56;\n  --color-accent-2-800: #790e3d;\n  --color-accent-2-900: #4b1528;\n\n  /* The third process ink — review round 3: the deck's print treatments\n     (the CMYK separation and the misregistered plate numerals below) need\n     the full four-color set. Cyan and magenta are the system's own accents;\n     this yellow completes them, muted to the same press-ink register. A\n     print treatment color, not an interface accent — body copy and chrome\n     never take it. */\n  --color-process-yellow: #edbb00;\n\n  --font-heading: \"Source Serif 4\", system-ui, sans-serif;\n  --font-heading-weight: 600;\n  --font-body: \"Source Serif 4\", system-ui, sans-serif;\n\n  --space-1: 5.0px;\n  --space-2: 10.0px;\n  --space-3: 15.0px;\n  --space-4: 20.0px;\n  --space-6: 30.0px;\n  --space-8: 40.0px;\n\n  --radius-sm: 1px;\n  --radius-md: 2px;\n  --radius-lg: 4px;\n\n  /* Elevation — derived from the ground: soft ink-tinted shadows on a\n     light theme, a hairline edge + ambient darkness on a dark one. */\n  --shadow-sm: 0 1px 2px color-mix(in srgb, #2d2b2b 14%, transparent);\n  --shadow-md: 0 3px 10px color-mix(in srgb, #2d2b2b 16%, transparent);\n  --shadow-lg: 0 12px 32px color-mix(in srgb, #2d2b2b 22%, transparent);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.halftone{position:relative;filter:grayscale(0.35) contrast(1.15);overflow:hidden}\n.halftone::after{content:\"\";position:absolute;inset:0;pointer-events:none;\n  background-image:radial-gradient(circle,rgba(0,0,0,0.22) 30%,transparent 32%);\n  background-size:3px 3px;mix-blend-mode:multiply}\n\n/* The four-color separation treatment (review round 3) — a photograph\n   printed as its misregistered process plates, after the Catalogue Three\n   grammar. Markup: a figure.cmyk holding five copies of the image — the\n   first is the layout sizer (hidden), then one per plate, each tagged\n   .sep-c/.sep-m/.sep-y/.sep-k. The plates are extracted live by the SVG\n   feColorMatrix filters in print-plates.js, the system's own defs —\n   inlined in the compiled bundle every template page loads, and a\n   page that links styles.css directly adds\n   <script src=\"print-plates.js\"><\u002Fscript> itself (the defs must be in\n   the document: a data-URI filter reference would not survive Chromium,\n   and external-file references are unreliable across engines) — nudged\n   a few pixels out of register, and multiplied\n   onto the paper ground; the halftone dot screens the recombined print.\n   The plate offsets live with the deck's projection-scale CSS, since\n   misregistration is sized to the output. */\n.cmyk{position:relative;overflow:hidden;background:var(--color-bg)}\n.cmyk img:first-child{opacity:0} /* layout sizer AND the alt-bearing image — opacity\n  keeps it in the accessibility tree (visibility:hidden would drop the figure's only\n  description); fully transparent, it adds nothing to the multiply backdrop */\n.cmyk img+img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;mix-blend-mode:multiply}\n.cmyk .sep-c{filter:url(#sep-c)}\n.cmyk .sep-m{filter:url(#sep-m)}\n.cmyk .sep-y{filter:url(#sep-y)}\n.cmyk .sep-k{filter:url(#sep-k)}\n.cmyk::after{content:\"\";position:absolute;inset:0;pointer-events:none;\n  background-image:radial-gradient(circle,rgba(0,0,0,0.22) 30%,transparent 32%);\n  background-size:3px 3px;mix-blend-mode:multiply}\n\n/* The one-image separation (review round 9, promoted from the deck in the\n   landing divergence) — the same four plates as ONE compound filter,\n   #sep-all in print-plates.js, for a single swappable image: a .print\n   wrapper inside the figure holds one <image-slot>, and the filter\n   extracts, offsets and multiplies the plates live from whatever the slot\n   shows. Markup: figure.cmyk > .print > image-slot (the page sizes the\n   .print — aspect-ratio, or absolute fill for bleeds). Hover resolves\n   the print into the photograph — the pressman checking registration on\n   the light table — so the source shows crisp and any swap chrome stays\n   legible; only the reduced-motion fallback below still lifts as a\n   single cut (a url() filter cannot CSS-transition; the press driver\n   animates the defs instead). */\n.cmyk .print{position:relative;width:100%;filter:url(#sep-all)}\n/* no hover end-state swap: the press driver (print-plates.js) eases the\n   plates into register while purifying their inks to the pure-process\n   separation on the same curve, so the converged four-plate merge IS\n   the photograph (their multiply equals SourceGraphic by construction)\n   — no cut anywhere on the animated path */\n@media (prefers-reduced-motion: reduce), (hover: none), (pointer: coarse) {\n  .cmyk .print:hover{filter:none} /* without the driver (it stands down on\n    exactly these conditions), hover stays the old single cut to the\n    crisp source */\n}\n.cmyk .print image-slot{width:100%;height:100%;display:block}\n\n/* The plate numeral (review rounds 3-4) — display figures set as\n   misregistered process plates, the catalog's cover grammar. Review\n   round 4 (Barron): THREE plates — C, M, Y only, no black plate — so the\n   dark core comes entirely from the C×M×Y multiply overlap (the inks\n   product to exact black), with the fringes the registration drift; and\n   the spread pulled in by half (less jumbled: one figure with plate\n   fringes rather than figures sliding apart). Markup: a .cmyk-num holding\n   a .paper span (the white of the sheet: the glyph's union, built from\n   offset text-shadow copies) and three .plate spans. The construction\n   carries its own ground (--cmyk-num-ground, defaulting to paper) painted\n   on its padding box, so the multiply plates always have their backdrop\n   even inside an isolated stacking context (entrance animations); the\n   padding bleeds wider than any plate offset and the negative margin\n   hands the layout box back. Offsets are em-scaled to the glyph. The\n   .paper span carries the text once for assistive tech; the .plate spans\n   are aria-hidden repeats. */\n.cmyk-num{--cmyk-num-ground:var(--color-bg);\n  position:relative;width:fit-content;line-height:0.9;\n  font-feature-settings:\"pnum\" 1;\n  background:var(--cmyk-num-ground);padding:0.12em;margin:-0.12em}\n.cmyk-num .paper{color:var(--color-bg); /* the white of the sheet — always paper,\n  whatever the ground: the plates read as printed on paper even when the\n  surrounding page is ink */\n  text-shadow:0.036em 0.025em 0 var(--color-bg),-0.031em -0.023em 0 var(--color-bg)}\n.cmyk-num .plate{position:absolute;inset:0.12em;mix-blend-mode:multiply;\n  text-box:trim-both cap alphabetic /* the host trims to its cap box; each\n  absolute plate must trim its own line the same way, or its glyphs sit a\n  half-leading below the paper union */}\n.cmyk-num .plate-c{color:var(--color-accent)}\n\n/* The plate headline (divergence round 3, Barron: \"use both\" — the\n   photograph's plates AND the cover grammar's text plates, on the same\n   page). The same three-plate construction as .cmyk-num — paper span\n   carrying the real text, C/M/Y plate repeats, dark core from the\n   multiply overlap — at HALF the numeral's round-4 offsets: the serif's\n   display hairlines are thinner than the numeral strokes the spread was\n   measured on, and the full offsets swallow them whole (probed at the\n   hero's 80px — the fringes read as an anaglyph poster, not a breath\n   out of register) — recut for display\n   headlines that sit in running text blocks on the page's own paper:\n   no ground painting and no padding bleed (the numeral's ground exists\n   for isolated stacking contexts; a headline on the page multiplies\n   straight onto the sheet), no width:fit-content and no line-height\n   override (the host display class owns its metrics — apply this to\n   each .line, which is position:relative for its plates), and the\n   plates are inert to the hand (pointer-events/user-select none, so a\n   triple-click selects the headline once, not four times). Plates take\n   the same pointer lean as .cmyk-num. */\n.cmyk-head{position:relative}\n.cmyk-head .paper{color:var(--color-bg);\n  text-shadow:0.027em 0.0185em 0 var(--color-bg),-0.0245em -0.0175em 0 var(--color-bg)\n  /* the union's copies sit at the construction's halved plate offsets\n     PLUS the full lean (0.018+0.009 / 0.0125+0.006, and mirrored), so\n     the union still backs the plates at viewport-edge lean — invisible\n     on the page's own paper, load-bearing on any other ground */}\n.cmyk-head .plate{position:absolute;inset:0;mix-blend-mode:multiply;\n  pointer-events:none;user-select:none;\n  text-box:trim-both cap alphabetic /* match the host's trim, or the\n  plates sit a half-leading below the paper union */}\n.cmyk-head .plate-c{color:var(--color-accent)}\n.cmyk-head .plate-m{color:var(--color-accent-2);\n  translate:calc(0.018em + 0.009em*var(--press-nx, 0)) calc(0.0125em + 0.006em*var(--press-ny, 0))}\n.cmyk-head .plate-y{color:var(--color-process-yellow);\n  translate:calc(-0.0155em + 0.009em*var(--press-nx, 0)) calc(-0.0115em + 0.006em*var(--press-ny, 0))}\n.cmyk-num .plate-m{color:var(--color-accent-2);\n  translate:calc(0.036em + 0.018em*var(--press-nx, 0)) calc(0.025em + 0.0125em*var(--press-ny, 0))}\n.cmyk-num .plate-y{color:var(--color-process-yellow);\n  translate:calc(-0.031em + 0.018em*var(--press-nx, 0)) calc(-0.023em + 0.0125em*var(--press-ny, 0))}\n/* --press-nx/--press-ny: the pointer lean as a bare -1..1 factor,\n   published on :root by the press driver (print-plates.js) and zero\n   whenever the driver stands down. Each construction scales the lean to\n   its own spread (half of it, here as everywhere) so the moving plates\n   drift a breath toward the cursor and the C plate holds. */\n\n/* ══════════════════════════════════════════════════════════════════════════\n   Components — built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n.hr {\n  height: 1px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { background: var(--color-accent); color: var(--color-bg); }\n.btn-primary:hover { background: var(--color-accent-600); }\n.btn-primary:active { background: var(--color-accent-700); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input::placeholder { color: color-mix(in srgb, var(--color-text) 65%, transparent); opacity: 1; }\n  /* explicit, measured: the browser default gray misses the 4.5:1 small-text bar on\n     the surface fill; 65% ink measures 4.8:1 there, still a step quieter than typed\n     text (opacity:1 overrides Firefox's default placeholder fade) */\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* — cards — */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* — tags — */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { backg :column;gap:26px;max-width:1240px;margin:0 auto;padding:40px 48px 44px}\n.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:40px;align-items:start}\n.bar{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap}\n.kick{font:800 14px/1.2 var(--font-body);letter-spacing:.14em;text-transform:uppercase;color:var(--color-accent-700);margin:0}\n.lbl{font:800 13px/1.2 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--color-neutral-700);margin:0}\n.opt{display:flex;align-items:center;gap:18px;min-height:76px;padding:12px 22px;border:0;background:transparent;text-align:left;font:700 24px/1.3 var(--font-body);color:var(--color-text);border-radius:22px;cursor:pointer;width:100%;box-sizing:border-box;transition:background .12s}\n.opt:hover{background:var(--color-accent-100)}\n.opt:active{background:var(--color-accent-200)}\n.bub{width:40px;height:40px;flex:none;border-radius:50%;border:2.5px solid var(--color-neutral-400);display:flex;align-items:center;justify-content:center;font:800 17px var(--font-body)}\n.fld{width:100%;box-sizing:border-box;font:600 20px var(--font-body);color:var(--color-text);background:#fff;border:2px solid var(--color-neutral-300);padding:14px 16px;border-radius:16px}\n.fld::placeholder{font-weight:400;color:var(--color-neutral-500)}\n.fld:focus{outline:none;border-color:var(--color-accent);box-shadow:0 0 0 4px var(--color-accent-100)}\ntextarea.fld{line-height:1.5;resize:vertical}\n.chip{border:2px solid var(--color-neutral-300);background:#fff;font:700 17px var(--font-body);color:var(--color-text);padding:12px 20px;border-radius:999px;cursor:pointer;min-height:56px;transition:transform .1s,background .12s}\n.chip:hover{border-color:var(--color-accent)}\n.chip:active{transform:scale(.97)}\n.act{display:inline-flex;align-items:center;justify-content:center;border:0;font:800 20px var(--font-body);padding:18px 34px;border-radius:22px;cursor:pointer;min-height:68px;transition:background .12s,transform .1s}\n.act:active{transform:scale(.99)}\n.act-primary{background:var(--color-accent);color:#fffaf3;box-shadow:0 4px 0 #0a6d66}\n.act-primary:hover{background:#0a7d75}\n.act-soft{background:var(--color-accent-100);color:var(--color-accent-700)}\n.act-soft:hover{background:var(--color-accent-200)}\n.act-ghost{background:transparent;color:var(--color-neutral-700);font-weight:700}\n.act-ghost:hover{background:var(--color-neutral-200)}\n.acts{display:flex;gap:16px;flex-wrap:wrap;align-items:center}\n:focus-visible{outline:3px solid var(--color-accent);outline-offset:3px}\n.wcell{cursor:pointer;transition:opacity .1s}\n.wcell:hover{opacity:.8}\n.rtable{width:100%;border-collapse:collapse;font-size:12pt}\n.rtable th{text-align:left;font-weight:800;border-bottom:2px solid #2d2a32;padding:7px 10px 7px 0}\n.rtable td{border-bottom:1px solid rgba(45,42,50,.18);padding:7px 10px 7px 0;vertical-align:top}\n.rtable tr{break-inside:avoid}\n@media print{.noprint{display:none !important}}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<sc-if value=\"{{ inApp }}\" hint-placeholder-val=\"{{ true }}\">\n<div>\n\n<sc-if value=\"{{ atIntro }}\" hint-placeholder-val=\"{{ true }}\">\n<div class=\"scr\">\n<div class=\"bar\"><p class=\"kick\">{{ schoolName }}<\u002Fp><p class=\"kick\" style=\"color:var(--color-neutral-600)\">Interviewer-led · 3 parts<\u002Fp><\u002Fdiv>\n<h1 style=\"font-size:54px;line-height:1.05;margin:0;max-width:20em\">Attendance &amp; Wellbeing Survey<\u002Fh1>\n<div class=\"two\">\n<div style=\"display:grid;gap:22px\">\n<p style=\"margin:0;font-size:21px;line-height:1.5;color:var(--color-neutral-800);max-width:32em\">Three short parts. Tap through them together — you can pause any time, and nothing is saved until you make the report.<\u002Fp>\n<div style=\"display:grid;grid-template-columns:1fr 1fr;gap:20px\">\n<div><p class=\"lbl\" style=\"margin-bottom:8px\">Date<\u002Fp><input class=\"fld\" value=\"{{ f_date }}\" sc-camel-on-input=\"{{ onDate }}\"><\u002Fdiv>\n<div><p class=\"lbl\" style=\"margin-bottom:8px\">Student<\u002Fp><input class=\"fld\" placeholder=\"First name\" value=\"{{ f_student }}\" sc-camel-on-input=\"{{ onStudent }}\"><\u002Fdiv>\n<div><p class=\"lbl\" style=\"margin-bottom:8px\">Interviewer<\u002Fp><input class=\"fld\" placeholder=\"Your name\" value=\"{{ f_interviewer }}\" sc-camel-on-input=\"{{ onInterviewer }}\"><\u002Fdiv>\n<div><p class=\"lbl\" style=\"margin-bottom:8px\">Attendance %<\u002Fp><input class=\"fld\" placeholder=\"e.g. 62\" value=\"{{ f_attendance }}\" sc-camel-on-input=\"{{ onAttendance }}\"><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div>\n<p class=\"lbl\" style=\"margin-bottom:14px\">Current mood<\u002Fp>\n<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:12px\">\n<sc-for list=\"{{ moods }}\" as=\"m\" hint-placeholder-count=\"5\">\n<button style=\"border:0;background:{{ m.bg }};padding:18px 8px 16px;border-radius:22px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:12px\" sc-camel-on-click=\"{{ m.on }}\">\n<svg sc-camel-view-box=\"0 0 40 40\" style=\"width:62px;height:62px;display:block\"><circle cx=\"20\" cy=\"20\" r=\"18\" fill=\"none\" stroke=\"{{ m.ink }}\" stroke-width=\"1.6\"><\u002Fcircle><circle cx=\"14\" cy=\"16\" r=\"1.9\" fill=\"{{ m.ink }}\"><\u002Fcircle><circle cx=\"26\" cy=\"16\" r=\"1.9\" fill=\"{{ m.ink }}\"><\u002Fcircle><path d=\"{{ m.mouth }}\" fill=\"none\" stroke=\"{{ m.ink }}\" stroke-width=\"1.6\" stroke-linecap=\"round\"><\u002Fpath><path d=\"{{ m.brow }}\" fill=\"none\" stroke=\"{{ m.ink }}\" stroke-width=\"1.4\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg>\n<span style=\"font:700 15px/1.2 var(--font-body);text-align:center;color:{{ m.ink }}\">{{ m.label }}<\u002Fspan>\n<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"flex:1\"><\u002Fdiv>\n<div class=\"acts\"><button class=\"act act-primary\" sc-camel-on-click=\"{{ toP1 }}\">Start Part 1<\u002Fbutton><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ atP1Intro }}\" hint-placeholder-val=\"{{ false }}\">\n<div class=\"scr\">\n<p class=\"kick\">Part 1 of 3<\u002Fp>\n<h2 style=\"font-size:46px;margin:0\">School attendance<\u002Fh2>\n<div class=\"two\">\n<div style=\"display:grid;gap:16px;max-width:30em\">\n<p style=\"font-size:22px;line-height:1.55;margin:0\">Please answer the following questions.<\u002Fp>\n<p style=\"font-size:20px;line-height:1.55;margin:0;color:var(--color-neutral-800)\">Sixteen questions, one at a time. There are no wrong answers — whatever is true for you is the right one.<\u002Fp>\n<\u002Fdiv>\n<div style=\"display:grid;gap:12px\">\n<p class=\"lbl\">The five answers<\u002Fp>\n<sc-for list=\"{{ scaleLegend }}\" as=\"s\" hint-placeholder-count=\"5\">\n<div style=\"display:flex;gap:18px;align-items:center\"><span style=\"font:800 18px var(--font-body);color:var(--color-accent-700);width:22px\">{{ s.v }}<\u002Fspan><span style=\"font-size:21px\">{{ s.label }}<\u002Fspan><\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"flex:1\"><\u002Fdiv>\n<div class=\"acts\"><button class=\"act act-primary\" sc-camel-on-click=\"{{ toQ }}\">First question<\u002Fbutton><button class=\"act act-ghost\" sc-camel-on-click=\"{{ toIntro }}\">Back<\u002Fbutton><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ atQ }}\" hint-placeholder-val=\"{{ false }}\">\n<div class=\"scr\">\n<div class=\"bar\" style=\"justify-content:space-between\"><p class=\"kick\">Part 1 · Question {{ qNum }} of 16<\u002Fp><span style=\"font:700 14px var(--font-body);letter-spacing:.1em;color:var(--color-neutral-600)\">{{ qTag }}<\u002Fspan><\u002Fdiv>\n<div style=\"height:5px;background:var(--color-neutral-300);border-radius:3px\"><div style=\"height:5px;background:var(--color-accent);border-radius:3px;width:{{ qProgress }}\"><\u002Fdiv><\u002Fdiv>\n<div class=\"two\" style=\"gap:56px;flex:1\">\n<h3 style=\"font-size:40px;line-height:1.24;margin:8px 0 0;text-wrap:pretty\">{{ qText }}<\u002Fh3>\n<div style=\"display:grid;gap:6px\">\n<sc-for list=\"{{ qOptions }}\" as=\"o\" hint-placeholder-count=\"5\">\n<button class=\"opt\" style=\"background:{{ o.bg }}\" sc-camel-on-click=\"{{ o.on }}\">\n<span class=\"bub\" style=\"border-color:{{ o.ring }};background:{{ o.dot }};color:{{ o.num }}\">{{ o.v }}<\u002Fspan>\n<span style=\"color:{{ o.fg }}\">{{ o.label }}<\u002Fspan>\n<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"acts\"><button class=\"act act-ghost\" sc-camel-on-click=\"{{ prevQ }}\">Back<\u002Fbutton><button class=\"act act-soft\" sc-camel-on-click=\"{{ nextQ }}\">{{ nextLabel }}<\u002Fbutton><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ atScore }}\" hint-placeholder-val=\"{{ false }}\">\n<div class=\"scr\">\n<p class=\"kick\">Part 1 · Scoring<\u002Fp>\n<h2 style=\"font-size:44px;margin:0\">Function of the behaviour<\u002Fh2>\n<p style=\"font-size:19px;line-height:1.5;margin:0;color:var(--color-neutral-700);max-width:46em\">The highest-scoring condition is the primary maintaining variable for school refusal behaviour.<\u002Fp>\n<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:34px\">\n<sc-for list=\"{{ domains }}\" as=\"d\" hint-placeholder-count=\"4\">\n<div>\n<div style=\"display:flex;align-items:baseline;gap:12px\">\n<span style=\"font:800 26px var(--font-body);color:{{ d.letterInk }}\">{{ d.letter }}<\u002Fspan>\n<span style=\"font-size:16px;color:var(--color-neutral-700);flex:1\">{{ d.reinf }}<\u002Fspan>\n<span style=\"font:800 20px var(--font-body)\">{{ d.scoreLabel }}<\u002Fspan>\n<\u002Fdiv>\n<div style=\"height:14px;background:var(--color-neutral-200);border-radius:8px;margin:10px 0 9px\"><div style=\"height:14px;border-radius:8px;background:{{ d.ink }};width:{{ d.pct }}\"><\u002Fdiv><\u002Fdiv>\n<p style=\"font-size:18px;line-height:1.45;margin:0\">{{ d.desc }}<\u002Fp>\n<p style=\"font-size:16px;line-height:1.45;margin:5px 0 0;color:var(--color-neutral-700)\">{{ d.examples }}<\u002Fp>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<p style=\"font-size:20px;line-height:1.5;margin:0;max-width:52em\"><span style=\"color:var(--color-accent-2-700);font-weight:800\">Primary function:<\u002Fspan> {{ primaryLine }}<\u002Fp>\n<p style=\"font-size:16px;line-height:1.45;margin:0;color:var(--color-neutral-700);max-width:52em\">{{ partialNote }}<\u002Fp>\n<div style=\"flex:1\"><\u002Fdiv>\n<div class=\"acts\"><button class=\"act act-primary\" sc-camel-on-click=\"{{ toBreak }}\">Continue<\u002Fbutton><button class=\"act act-ghost\" sc-camel-on-click=\"{{ backToQ }}\">Back to questions<\u002Fbutton><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ atBreak }}\" hint-placeholder-val=\"{{ false }}\">\n<div class=\"scr\" style=\"justify-content:center;gap:30px\">\n<p class=\"kick\">Pause<\u002Fp>\n<h2 style=\"font-size:88px;line-height:1;margin:0\">Take a break!<\u002Fh2>\n<p style=\"font-size:24px;line-height:1.5;margin:0;color:var(--color-neutral-800);max-width:24em\">That was the long part. Stretch, get a drink, and carry on when you are ready.<\u002Fp>\n<div class=\"acts\"><button class=\"act act-primary\" sc-camel-on-click=\"{{ toWheel }}\">Start Part 2<\u002Fbutton><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ atWheel }}\" hint-placeholder-val=\"{{ false }}\">\n<div class=\"scr\">\n<p class=\"kick\">Part 2 of 3<\u002Fp>\n<h2 style=\"font-size:44px;margin:0\">Wellbeing wheel<\u002Fh2>\n<p style=\"font-size:20px;line-height:1.5;margin:0;color:var(--color-neutral-800);max-width:52em\">How much do you agree with these statements? Tap a ring on each spoke — 5 is the middle, 1 is the rim.<\u002Fp>\n<div class=\"two\" style=\"gap:48px\">\n<div style=\"position:relative;width:620px;height:620px;max-width:100%\">\n<svg sc-camel-view-box=\"0 0 620 620\" style=\"position:absolute;inset:0;width:100%;height:100%\">\n<sc-for list=\"{{ wheelCells }}\" as=\"c\" hint-placeholder-count=\"40\">\n<path class=\"wcell\" d=\"{{ c.d }}\" fill=\"{{ c.fill }}\" stroke=\"#fffaf3\" stroke-width=\"2\" sc-camel-on-click=\"{{ c.on }}\"><\u002Fpath>\n<\u002Fsc-for>\n<sc-for list=\"{{ wheelSpokes }}\" as=\"s\" hint-placeholder-count=\"8\">\n<path d=\"{{ s.edge }}\" stroke=\"rgba(45,42,50,.22)\" stroke-width=\"1.4\" fill=\"none\"><\u002Fpath>\n<\u002Fsc-for>\n<\u002Fsvg>\n<sc-for list=\"{{ wheelLabels }}\" as=\"l\" hint-placeholder-count=\"8\">\n<div style=\"position:absolute;left:{{ l.left }};top:{{ l.top }};width:{{ l.w }};text-align:{{ l.align }};font:800 15px/1.3 var(--font-body);color:{{ l.ink }};pointer-events:none\">{{ l.n }} · {{ l.text }}<\u002Fdiv>\n<\u002Fsc-for>\n<sc-for list=\"{{ wheelTicks }}\" as=\"t\" hint-placeholder-count=\"5\">\n<div style=\"position:absolute;left:{{ t.left }};top:{{ t.top }};width:26px;text-align:center;font:800 15px var(--font-body);color:rgba(45,42,50,.5);pointer-events:none\">{{ t.n }}<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<div style=\"display:grid;gap:12px\">\n<div class=\"bar\" style=\"justify-content:space-between\"><p class=\"lbl\">Scores and comments<\u002Fp><span style=\"font-size:15px;color:var(--color-neutral-700)\">5 strongly agree · 1 strongly disagree<\u002Fspan><\u002Fdiv>\n<sc-for list=\"{{ wheelRows }}\" as=\"r\" hint-placeholder-count=\"8\">\n<div style=\"padding:12px 16px;background:{{ r.bg }};border-radius:20px\">\n<div style=\"display:flex;gap:12px;align-items:baseline\">\n<span style=\"font:800 16px var(--font-body);color:{{ r.ink }};width:16px\">{{ r.n }}<\u002Fspan>\n<span style=\"flex:1;font:700 19px/1.35 var(--font-body)\">{{ r.text }}<\u002Fspan>\n<span style=\"font:800 22px var(--font-body);color:{{ r.ink }}\">{{ r.val }}<\u002Fspan>\n<\u002Fdiv>\n<input class=\"fld\" style=\"margin-top:9px;font-size:17px;padding:10px 13px\" placeholder=\"Clarifying comment\" value=\"{{ r.note }}\" sc-camel-on-input=\"{{ r.onNote }}\">\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"flex:1\"><\u002Fdiv>\n<div class=\"acts\"><button class= ssoc }}<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<\u002Fsc-for>\n<\u002Fsc-raw-tbody>\n<\u002Fsc-raw-table>\n<div style=\"display:flex;gap:30px;margin-top:20px;flex-wrap:wrap\">\n<div style=\"flex:1;min-width:220px\">\n<h3 style=\"font:800 12.5pt var(--font-body);margin:0 0 6px\">Motivators<\u002Fh3>\n<ul style=\"margin:0;padding-left:20px;font-size:12pt;line-height:1.55\">\n<sc-for list=\"{{ motivatorItems }}\" as=\"m\" hint-placeholder-count=\"3\"><li>{{ m.label }}<\u002Fli><\u002Fsc-for>\n<\u002Ful>\n<p style=\"font-size:12pt;margin:0;color:#6b6157\">{{ noMotivators }}<\u002Fp>\n<\u002Fdiv>\n<div style=\"flex:1;min-width:220px\">\n<h3 style=\"font:800 12.5pt var(--font-body);margin:0 0 6px\">Barriers<\u002Fh3>\n<ul style=\"margin:0;padding-left:20px;font-size:12pt;line-height:1.55\">\n<sc-for list=\"{{ barrierItems }}\" as=\"m\" hint-placeholder-count=\"3\"><li>{{ m.label }}<\u002Fli><\u002Fsc-for>\n<\u002Ful>\n<p style=\"font-size:12pt;margin:0;color:#6b6157\">{{ noBarriers }}<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<h2 style=\"font:800 15pt var(--font-body);margin:28px 0 8px\">Comments<\u002Fh2>\n<p style=\"font-size:12.5pt;line-height:1.55;margin:0;white-space:pre-wrap\">{{ commentsLine }}<\u002Fp>\n<h2 style=\"font:800 15pt var(--font-body);margin:22px 0 8px\">Notes for the teacher<\u002Fh2>\n<p style=\"font-size:12.5pt;line-height:1.55;margin:0;white-space:pre-wrap\">{{ notesLine }}<\u002Fp>\n<\u002Fdoc-page>\n<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;schoolName&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Caldera School&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;autoAdvance&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;showDomainLetters&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}\">\nconst QS = [\n  [\"How often do you feel bad about going to school because of something happening at school that day? (e.g., café day)\",\"A\"],\n  [\"How often do you miss school because it’s hard to talk to other students?\",\"B\"],\n  [\"How often would you rather be with your family or carers than go to school?\",\"C\"],\n  [\"On days you don’t come to school, how often do you go out and do something fun instead?\",\"D\"],\n  [\"How often do you miss school because you know you’ll feel bad if you go? (e.g., sad, mad, scared)\",\"A\"],\n  [\"How often do you miss school because something might embarrass you in front of other people at school?\",\"B\"],\n  [\"How often do you think about your family or carer/s when you’re at school?\",\"C\"],\n  [\"On days you don’t come to school, how much do you enjoy doing different things? (Like going places, being with friends)\",\"D\"],\n  [\"How often do you feel worse about yourself when you’re at school (compared to how you feel about yourself when you’re with friends or at home)?\",\"A\"],\n  [\"How often do you miss school because you don’t have many friends at school?\",\"B\"],\n  [\"Would it be easier to go to school if your parents or carer/s were with you?\",\"C\"],\n  [\"Would it be easier to go to school if you had more time to do things you enjoy before or after school (like hang out with friends?)\",\"D\"],\n  [\"If you think about school on the weekends, how often does it make you feel bad (e.g., sad, mad, scared)?\",\"A\"],\n  [\"How often do you stay away from certain places at school to avoid talking to people?\",\"B\"],\n  [\"Do you ever think that you would prefer to be taught by your parents or carer/s at home?\",\"C\"],\n  [\"How often do miss school because you’d rather have fun outside of school?\",\"D\"]\n];\nconst SCALE = [\"Never\",\"Not much\",\"Half the time\",\"A lot\",\"Always\"];\nconst DOMAIN = {\n  A: {reinf:\"Negative reinforcement\", desc:\"Avoiding something that creates distress at, or before school.\", examples:\"Examples: Getting ready on time, uncertainty at school.\", phrase:\"get away from things at or before school that make them feel bad\"},\n  B: {reinf:\"Negative reinforcement\", desc:\"Avoiding specific social interactions or events/tasks that are evaluated/judged.\", examples:\"Examples: Interactions with teachers/other students, writing neatly, correct spelling.\", phrase:\"avoid social situations and tasks where they might be judged\"},\n  C: {reinf:\"Positive reinforcement\", desc:\"Seeking attention from significant others outside of school (attention seeking/separation anxiety).\", examples:\"Examples: Extra time with sibling, scared dad will leave or get in trouble.\", phrase:\"stay close to family or carers\"},\n  D: {reinf:\"Positive reinforcement\", desc:\"Seeking physical experiences external to school.\", examples:\"Examples: Going to beach, substance use, hanging out with friends.\", phrase:\"do something more enjoyable outside school\"}\n};\nconst FUNCTIONS = [\n  [\"A\",\"−\",\"Difficulties getting to/at school (not social/evaluative tasks)\",\"Has negative emotions associated with school.\"],\n  [\"B\",\"−\",\"Social and/or evaluative activities at school\",\"\"],\n  [\"C\",\"+\",\"Attention seeking/separation anxiety external to school\",\"Has positive emotions to stay at home (unrelated to school).\"],\n  [\"D\",\"+\",\"Activities external to school\",\"\"]\n];\nconst SPOKES = [\n  \"I have someone that cares for me\",\"I feel safe\",\"I feel good\",\"I feel good about my free time\",\n  \"I am included\",\"I take responsibility for myself and others\",\"I feel respected\",\"I do my best\"\n];\nconst MB = [\"Teachers/staff\",\"Friends at school\",\"Friends are not at the school\",\"The café\",\"Food at school\",\"Breaks\",\"Incentives (e.g., fun day)\",\"Feeling understood\",\"Feeling misunderstood\",\"Extra learning support\",\"Positive feedback\",\"Doing meaningful things\",\"A sense of achievement\",\"Being able to choose what I do\",\"Seeing people like me succeed\",\"Problems at home\",\"Getting in trouble\",\"Difficulties with other students\",\"Not having freedom of choice\",\"School events\",\"Learning challenges/difficulties\",\"Morning/evening routine\",\"Rules/ no consistency with rules\",\"Learning doesn’t seem relevant\",\"School is boring\",\"Feeling depressed/mental health\",\"Feeling unwell/physical health\"];\nconst MOODS = [\n  [\"Sad / Down\",\"M13 27 q7 -5 14 0\",\"M11 11 q3 -2 6 0 M23 11 q3 -2 6 0\"],\n  [\"Worried / Anxious\",\"M13 26 q4 -3 7 0 q3 3 7 0\",\"M10 11 q4 -3 7 1 M23 12 q3 -4 7 -1\"],\n  [\"Happy / Calm\",\"M12 24 q8 7 16 0\",\"\"],\n  [\"Annoyed / Frustrated\",\"M13 26 h14\",\"M10 12 q4 1 7 -1 M23 11 q3 2 7 1\"],\n  [\"Angry / Mad\",\"M13 28 q7 -6 14 0\",\"M10 10 q4 3 7 4 M23 14 q3 -1 7 -4\"]\n];\nconst CY = \"#0d8f86\", MG = \"#ef6c4d\", INK = \"#2d2a32\", MUTE = \"#6b6157\";\nconst PAPER = \"#fffaf3\";\n// the eight wellbeing-wheel spoke colours, in the order the paper survey prints them\nconst SPOKE_COLORS = [\"#2f5bb7\", \"#6a5bc0\", \"#e0519f\", \"#e8446f\", \"#f07a35\", \"#f5a623\", \"#3fb877\", \"#22b3ab\"];\nconst MOOD_COLORS = [\"#4a86c9\", \"#6a5bc0\", \"#3fb877\", \"#f5a623\", \"#ef6c4d\"];\nconst tint = (hex, pct) => `color-mix(in srgb, ${hex} ${pct}%, ${PAPER})`;\nconst list = arr => arr.length > 1 ? arr.slice(0, -1).join(\", \") + \" and \" + arr[arr.length - 1] : (arr[0] || \"\");\n\nclass Component extends DCLogic {\n  state = {\n    screen: \"intro\", qi: 0,\n    date: \"16 September 2026\", student: \"\", interviewer: \"\", attendance: \"\",\n    mood: null, answers: Array(16).fill(null), wheel: Array(8).fill(0), wheelNotes: Array(8).fill(\"\"),\n    mb: {}, mbMode: 1, comments: \"\", notes: \"\"\n  };\n\n  set(k, v) { this.setState({ [k]: v }); }\n  go(screen) { this.setState({ screen }); window.scrollTo(0, 0); }\n\n  scores() {\n    const s = { A: 0, B: 0, C: 0, D: 0 }, n = { A: 0, B: 0, C: 0, D: 0 };\n    this.state.answers.forEach((v, i) => {\n      const d = QS[i][1];\n      if (v !== null) { s[d] += v; n[d] += 1; }\n    });\n    return { s, n };\n  }\n  primary() {\n    const { s } = this.scores();\n    let best = \"A\";\n    [\"B\", \"C\", \"D\"].forEach(k => { if (s[k] > s[best]) best = k; });\n    return (s.A + s.B + s.C + s.D) === 0 ? null : best;\n  }\n\n  answer(i, v) {\n    const auto = this.props.autoAdvance ?? true;\n    this.setState(prev => {\n      const answers = prev.answers.slice();\n      answers[i] = v;\n      return { answers };\n    });\n    if (!auto) return;\n    setTimeout(() => {\n      if (i >= 15) this.setState({ screen: \"score\" });\n      else this.setState({ qi: i + 1 });\n    }, 200);\n  }\n\n  // sector i clockwise from 12 o'clock; band 1 (centre) .. 5 (rim)\n  arc(i, band, cx, cy, R) {\n    const a0 = -Math.PI / 2 + i * Math.PI / 4, a1 = a0 + Math.PI / 4;\n    const r0 = R * (band - 1) / 5, r1 = R * band / 5;\n    const p = (r, a) => [cx + r * Math.cos(a), cy + r * Math.sin(a)];\n    const [x1, y1] = p(r1, a0), [x2, y2] = p(r1, a1), [x3, y3] = p(r0, a1), [x4, y4] = p(r0, a0);\n    if (band === 1) return `M ${cx} ${cy} L ${x1} ${y1} A ${r1} ${r1} 0 0 1 ${x2} ${y2} Z`;\n    return `M ${x1} ${y1} A ${r1} ${r1} 0 0 1 ${x2} ${y2} L ${x3} ${y3} A ${r0} ${r0} 0 0 0 ${x4} ${y4} Z`;\n  }\n\n  // one narrative paragraph set about the student, for the report\n  blurb() {\n    const st = this.state, { s } = this.scores(), prim = this.primary();\n    const name = st.student || \"The student\";\n    const out = [];\n\n    const rated = SPOKES.map((t, i) => ({ t, v: st.wheel[i] })).filter(x => x.v > 0);\n    if (rated.length) {\n      const max = Math.max.apply(null, rated.map(x => x.v));\n      const min = Math.min.apply(null, rated.map(x => x.v));\n      const highs = rated.filter(x => x.v === max).map(x => \"“\" + x.t + \"”\");\n      const lows = rated.filter(x => x.v === min).map(x => \"“\" + x.t + \"”\");\n      out.push(max === min\n        ? `On the wellbeing wheel ${name} rated every statement answered at ${max} out of 5.`\n        : `On the wellbeing wheel ${name} ranks highest on ${list(highs)} (${max} out of 5), and lowest on ${list(lows)} (${min} out of 5).`);\n    } else {\n      out.push(`The wellbeing wheel was not completed in this session.`);\n    }\n\n    if (prim) {\n      out.push(`Part 1 identifies function ${prim} as the primary maintaining variable for ${name}’s school refusal behaviour — ${DOMAIN[prim].desc.charAt(0).toLowerCase() + DOMAIN[prim].desc.slice(1).replace(/\\.$/, \"\")} (A ${s.A}, B ${s.B}, C ${s.C}, D ${s.D}, each out of 16). ${name} most often does not attend in order to ${DOMAIN[prim].phrase}.`);\n    } else {\n      out.push(`Part 1 was not scored in this session, so no primary function has been identified.`);\n    }\n\n    const motivators = MB.filter(m => st.mb[m] === 1);\n    const barriers = MB.filter(m => st.mb[m] === 2);\n    if (motivators.length || barriers.length) {\n      const bits = [];\n      if (barriers.length) bits.push(`${name} named ${list(barriers.map(b => b.toLowerCase()))} as barriers to attending`);\n      if (motivators.length) bits.push(`${motivators.length && barriers.length ? \"and \" : \"\"}${list(motivators.map(b => b.toLowerCase()))} as motivators`);\n      out.push(bits.join(\", \") + \".\");\n    }\n\n    const tail = [];\n    if (st.attendance) tail.push(`attendance is currently ${st.attendance}%`);\n    if (st.mood !== null) tail.push(`${name} described their mood on the day of the survey as ${MOODS[st.mood][0].toLowerCase()}`);\n    if (tail.length) out.push(tail.join(\", \").replace(/^./, c => c.toUpperCase()) + \".\");\n\n    return out.map(text => ({ text }));\n  }\n\n  renderVals() {\n    const st = this.state, sc = st.screen;\n    const { s, n } = this.scores();\n    const prim = this.primary();\n    const qi = st.qi, q = QS[qi];\n    const answered = st.answers.filter(v => v !== null).length;\n    const showLetters = this.props.showDomainLetters ?? true;\n\n    const CX = 310, CY_ = 310, R = 196;\n    const wheelCells = [], reportWheelCells = [];\n    SPOKES.forEach((_, i) => {\n      const val = st.wheel[i];\n      for (let band = 1; band <= 5; band++) {\n        const score = 6 - band;\n        // fill grows from the middle outward: the centre ring is 5\n        const on = val > 0 && band <= 6 - val;\n        const fill = on ? tint(SPOKE_COLORS[i], 94 - band * 13) : \"#fdf6ec\";\n        wheelCells.push({\n          d: this.arc(i, band, CX, CY_, R), fill,\n          on: () => this.setState(prev => {\n            const w = prev.wheel.slice();\n            w[i] = w[i] === score ? 0 : score;\n            return { wheel: w };\n          })\n        });\n        reportWheelCells.push({ d: this.arc(i, band, 165, 165, 150), fill });\n      }\n    });\n\n    const spokeEdge = (i, cx, cy, r) => {\n      const a = -Math.PI / 2 + i * Math.PI / 4;\n      return `M ${cx} ${cy} L ${cx + r * Math.cos(a)} ${cy + r * Math.sin(a)}`;\n    };\n    const wheelSpokes = SPOKES.map((_, i) => ({ edge: spokeEdge(i, CX, CY_, R) }));\n    const reportWheelSpokes = SPOKES.map((_, i) => ({ edge: spokeEdge(i, 165, 165, 150) }));\n\n    // statement labels sit just outside their own segment\n    const LW = 132;\n    const wheelLabels = SPOKES.map((t, i) => {\n      const mid = -Math.PI / 2 + (i + 0.5) * Math.PI / 4;\n      const lr = R + 58;\n      const cx = CX + lr * Math.cos(mid), cy = CY_ + lr * Math.sin(mid);\n      const align = Math.cos(mid) > 0.25 ? \"left\" : (Math.cos(mid) < -0.25 ? \"right\" : \"center\");\n      let left = cx - LW / 2;\n      if (align === \"left\") left = Math.min(cx - 16, 620 - LW);\n      if (align === \"right\") left = Math.max(cx - LW + 16, 0);\n      return {\n        n: i + 1, text: t, ink: SPOKE_COLORS[i], w: LW + \"px\", align,\n        left: Math.round(left) + \"px\", top: Math.round(cy - 26) + \"px\"\n      };\n    });\n\n    const wheelRows = SPOKES.map((t, i) => ({\n      n: i + 1, text: t, val: st.wheel[i] || \"—\",\n      ink: SPOKE_COLORS[i],\n      bg: st.wheel[i] ? tint(SPOKE_COLORS[i], 13) : \"#fdf6ec\",\n      note: st.wheelNotes[i],\n      onNote: e => {\n        const v = e.target.value;\n        this.setState(prev => {\n          const arr = prev.wheelNotes.slice();\n          arr[i] = v;\n          return { wheelNotes: arr };\n        });\n      }\n    }));\n\n    const motivators = MB.filter(m => st.mb[m] === 1);\n    const barriers = MB.filter(m => st.mb[m] === 2);\n\n    return {\n      schoolName: this.props.schoolName ?? \"Caldera School\",\n      inApp: sc !== \"report\", atReport: sc === \"report\",\n      atIntro: sc === \"intro\", atP1Intro: sc === \"p1intro\", atQ: sc === \"q\", atScore: sc === \"score\",\n      atBreak: sc === \"break\", atWheel: sc === \"wheel\", atP3: sc === \"p3\", atMB: sc === \"mb\", atSummary: sc === \"summary\",\n\n      f_date: st.date, f_student: st.student, f_interviewer: st.interviewer, f_attendance: st.attendance,\n      onDate: e => this.set(\"date\", e.target.value),\n      onStudent: e => this.set(\"student\", e.target.value),\n      onInterviewer: e => this.set(\"interviewer\", e.target.value),\n      onAttendance: e => this.set(\"attendance\", e.target.value),\n      f_comments: st.comments, onComments: e => this.set(\"comments\", e.target.value),\n      f_notes: st.notes, onNotes: e => this.set(\"notes\", e.target.value),\n\n      moods: MOODS.map(([label, mouth, brow], i) => ({\n        label, mouth, brow,\n        ink: st.mood === i ? MOOD_COLORS[i] : MUTE,\n        bg: st.mood === i ? tint(MOOD_COLORS[i], 18) : \"#fdf6ec\",\n        on: () => this.set(\"mood\", i)\n      })),\n\n      scaleLegend: SCALE.map((label, v) => ({ v, label })),\n\n      toIntro: () => this.go(\"intro\"), toP1: () => this.go(\"p1intro\"),\n      toQ: () => { this.setState({ screen: \"q\", qi: 0 }); window.scrollTo(0, 0); },\n      toBreak: () => this.go(\"break\"), toWheel: () => this.go(\"wheel\"),\n      toScore: () => this.go(\"score\"), toP3: () => this.go(\"p3\"),\n      toMB: () => this.go(\"mb\"), toSummary: () => this.go(\"summary\"),\n      toReport: () => this.go(\"report\"), backToApp: () => this.go(\"summary\"),\n      backToQ: () => { this.setState({ screen: \"q\", qi: 15 }); window.scrollTo(0, 0); },\n      restart: () => this.setState({ screen: \"intro\", qi: 0, answers: Array(16).fill(null), wheel: Array(8).fill(0), wheelNotes: Array(8).fill(\"\"), mb: {}, comments: \"\", notes: \"\", mood: null, student: \"\", attendance: \"\" }),\n      doPrint: () => window.print(),\n\n      qNum: qi + 1, qText: q[0], qTag: showLetters ? \"Item \" + (qi + 1) + \" · \" + q[1] : \"\",\n      qProgress: Math.round((qi + 1) / 16 * 100) + \"%\",\n      qOptions: SCALE.map((label, v) => {\n        const sel = st.answers[qi] === v;\n        return {\n          v, label,\n          bg: sel ? \"#e4f5f2\" : \"transparent\",\n          ring: sel ? CY : \"#cfc4b5\",\n          dot: sel ? CY : \"transparent\",\n          num: sel ? PAPER : MUTE,\n          fg: sel ? \"#0a6d66\" : INK,\n          on: () => this.answer(qi, v)\n        };\n      }),\n      prevQ: () => qi === 0 ? this.go(\"p1intro\") : this.setState({ qi: qi - 1 }),\n      nextQ: () => qi >= 15 ? this.go(\"score\") : this.setState({ qi: qi + 1 }),\n      nextLabel: qi >= 15 ? \"See scoring\" : \"Skip\",\n\n      domains: [\"A\", \"B\", \"C\", \"D\"].map(k => ({\n        letter: k, reinf: DOMAIN[k].reinf, desc: DOMAIN[k].desc, examples: DOMAIN[k].examples,\n        scoreLabel: s[k] + \"/16\",\n        pct: Math.round(s[k] / 16 * 100) + \"%\",\n        ink: prim === k ? (k === \"A\" || k === \"B\" ? CY : MG) : \"#8a7e70\",\n        letterInk: prim === k ? (k === \"A\" || k === \"B\" ? \"#0a6d66\" : \"#c14b2c\") : \"#4a423a\"\n      })),\n      primaryLine: prim ? prim + \" — \" + DOMAIN[prim].desc : \"Answer some questions to see the primary function.\",\n      partialNote: answered < 16 && answered > 0\n        ? \"Only \" + answered + \" of 16 answered — if the student was unable to complete all questions, calculate the average score for each domain based on the number of questions answered (A \" + (n.A ? (s.A / n.A).toFixed(1) : \"–\") + \", B \" + (n.B ? (s.B / n.B).toFixed(1) : \"–\") + \", C \" + (n.C ? (s.C / n.C).toFixed(1) : \"–\") + \", D \" + (n.D ? (s.D / n.D).toFixed(1) : \"–\") + \").\"\n        : \"\",\n\n      wheelCells, wheelSpokes, wheelRows, wheelLabels, reportWheelCells, reportWheelSpokes,\n      wheelTicks: [1, 2, 3, 4, 5].map(k => ({\n        n: 6 - k,\n        left: Math.round(CX + R * (k - 0.5) / 5 - 13) + \"px\",\n        top: (CY_ - 11) + \"px\"\n      })),\n      clearWheel: () => this.setState({ wheel: Array(8).fill(0), wheelNotes: Array(8).fill(\"\") }),\n\n      functions: FUNCTIONS.map(([letter, sign, focus, assoc]) => ({\n        letter, sign, focus, assoc,\n        bg: prim === letter ? (sign === \"−\" ? \"#e4f5f2\" : \"#fff1ea\") : \"transparent\",\n        ink: prim === letter ? (sign === \"−\" ? \"#0a6d66\" : \"#c14b2c\") : \"#4a423a\"\n      })),\n\n      mbItems: MB.map(label => {\n        const v = st.mb[label] || 0;\n        return {\n          label,\n          bg: v === 1 ? \"#c7ebe5\" : v === 2 ? \"#ffdcce\" : \"#fff\",\n          border: v === 1 ? CY : v === 2 ? MG : \"#e3dacd\",\n          fg: v === 1 ? \"#0a6d66\" : v === 2 ? \"#a8401f\" : INK,\n          on: () => this.setState(prev => ({ mb: Object.assign({}, prev.mb, { [label]: (prev.mb[label] || 0) === prev.mbMode ? 0 : prev.mbMode }) }))\n        };\n      }),\n      modeMotBg: st.mbMode === 1 ? \"#c7ebe5\" : \"#fff\",\n      modeMotBorder: st.mbMode === 1 ? CY : \"#e3dacd\",\n      modeMotFg: st.mbMode === 1 ? \"#0a6d66\" : MUTE,\n      modeBarBg: st.mbMode === 2 ? \"#ffdcce\" : \"#fff\",\n      modeBarBorder: st.mbMode === 2 ? MG : \"#e3dacd\",\n      modeBarFg: st.mbMode === 2 ? \"#a8401f\" : MUTE,\n      setModeMot: () => this.setState({ mbMode: 1 }),\n      setModeBar: () => this.setState({ mbMode: 2 }),\n\n      summaryTitle: st.student ? st.student + \"’s survey\" : \"Survey complete\",\n      summaryMeta: [st.date, st.interviewer && \"with \" + st.interviewer, st.attendance && \"attendance \" + st.attendance + \"%\"].filter(Boolean).join(\" · \"),\n      scoreLine: \"A \" + s.A + \"/16 · B \" + s.B + \"/16 · C \" + s.C + \"/16 · D \" + s.D + \"/16\",\n      motivatorLine: motivators.length ? motivators.join(\", \") : \"None marked\",\n      barrierLine: barriers.length ? barriers.join(\", \") : \"None marked\",\n      commentsLine: st.comments || \"—\",\n      notesLine: st.notes || \"—\",\n\n      reportTitle: (st.student || \"Student\") + \" — attendance and wellbeing report\",\n      reportMeta: [\n        [\"Student\", st.student || \"—\"], [\"Date\", st.date || \"—\"],\n        [\"Interviewer\", st.interviewer || \"—\"],\n        [\"Attendance\", st.attendance ? st.attendance + \"%\" : \"—\"],\n        [\"Mood on the day\", st.mood === null ? \"—\" : MOODS[st.mood][0]]\n      ].map(([k, v]) => ({ k, v })),\n      blurb: this.blurb(),\n      reportItems: QS.map((qq, i) => ({\n        n: i + 1, text: qq[0], domain: qq[1],\n        answer: st.answers[i] === null ? \"—\" : SCALE[st.answers[i]] + \" (\" + st.answers[i] + \")\"\n      })),\n      motivatorItems: motivators.map(m => ({ label: m })),\n      barrierItems: barriers.map(m => ({ label: m })),\n      noMotivators: motivators.length ? \"\" : \"None marked.\",\n      noBarriers: barriers.length ? \"\" : \"None marked.\"\n    };\n  }\n}\n<\u002Fscript>\n\n\n<div id=\"__claude_design_branding\"><style>#__claude_design_branding{position:fixed;right:16px;bottom:16px;z-index:2147483646;display:flex;align-items:center;gap:7px;height:30px;padding:0 5px 0 10px;border-radius:999px;font-family:\"Anthropic Sans\",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;font-size:12.5px;font-weight:400;line-height:1;letter-spacing:normal;text-transform:none;color:#141413;background:rgba(255,255,255,.86);-webkit-backdrop-filter:blur(24px);backdrop-filter:
