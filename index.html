"{{ q.ph }}\" value=\"{{ q.value }}\" sc-camel-on-change=\"{{ q.set }}\"><\u002Ftextarea>\n              <\u002Flabel>\n            <\u002Fsc-for>\n            <div style=\"margin-top:22px; background:#C9F4F1; border-radius:22px; padding:16px 18px\">\n              <div style=\"display:flex; justify-content:space-between; align-items:baseline; gap:10px; flex-wrap:wrap\">\n                <span style=\"font-family:'Fredoka', 'Figtree', sans-serif; font-size:19px; font-weight:600; color:#14786F\">✖️ Times tables: 7s and 8s<\u002Fspan>\n                <span style=\"font-size:14px; font-weight:800; color:#14786F\">{{ ttScore }}<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"display:grid; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); gap:8px; margin-top:12px\">\n                <sc-for list=\"{{ ttQs }}\" as=\"q\" hint-placeholder-count=\"5\">\n                  <label style=\"display:flex; align-items:center; gap:8px; background:#fff; border-radius:14px; padding:8px 12px; box-shadow:{{ q.ring }}\">\n                    <span style=\"font-family:'Fredoka', 'Figtree', sans-serif; font-size:18px; font-weight:600; white-space:nowrap; color:#221B35\">{{ q.a }} × {{ q.b }} =<\u002Fspan>\n                    <input inputmode=\"numeric\" style=\"width:52px; min-width:0; font-size:18px; font-weight:700; padding:4px 6px; border-radius:8px; border:0; background:#F2FBFB; color:#221B35; outline:none; text-align:center\" value=\"{{ q.val }}\" sc-camel-on-change=\"{{ q.set }}\">\n                    <span style=\"font-size:18px\">{{ q.mark }}<\u002Fspan>\n                  <\u002Flabel>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <div style=\"display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-top:10px\">\n                <sc-if value=\"{{ ttDone }}\" hint-placeholder-val=\"{{ false }}\"><button type=\"button\" style=\"font-size:13.5px; font-weight:800; padding:8px 14px; border-radius:999px; border:0; background:#14786F; color:#fff; cursor:pointer\" sc-camel-on-click=\"{{ ttMore }}\">🔁 Try 8 more<\u002Fbutton><\u002Fsc-if>\n                <span style=\"font-size:13px; font-weight:600; color:#14786F\">{{ ttHint }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <sc-if value=\"{{ tdHasSummary }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"margin-top:18px; background:#fff; border-radius:18px; padding:14px 16px\">\n                <span style=\"display:block; font-size:12px; font-weight:800; letter-spacing:.1em; text-transform:uppercase; color:#14786F\">Today in one sentence<\u002Fspan>\n                <span style=\"display:block; font-size:16px; line-height:1.55; margin-top:4px; color:var(--ink)\">{{ tdSummary }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ tdCanSubmit }}\" hint-placeholder-val=\"{{ true }}\">\n              <div style=\"display:flex; gap:12px; align-items:center; flex-wrap:wrap; margin-top:18px\">\n                <button type=\"button\" style=\"font-family:'Fredoka', 'Figtree', sans-serif; font-size:19px; font-weight:600; padding:14px 28px; border-radius:999px; border:0; background:#7B4FD6; color:#fff; cursor:pointer; box-shadow:0 10px 24px -12px rgba(123,79,214,.8); opacity:{{ tdSubmitOp }}\" sc-camel-on-click=\"{{ tdSubmit }}\">Submit my day 🚀<\u002Fbutton>\n                <span style=\"font-size:13.5px; font-weight:700; color:#7B4FD6\">{{ tdSubmitHint }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ tdSubmitted }}\" hint-placeholder-val=\"{{ false }}\">\n              <button type=\"button\" style=\"margin-top:14px; font-size:13px; font-weight:700; padding:0; border:0; background:transparent; color:#7B4FD6; cursor:pointer\" sc-camel-on-click=\"{{ tdEdit }}\">✏️ Change my answers<\u002Fbutton>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ tdHasNote }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"margin-top:16px; background:linear-gradient(135deg, #7B4FD6, #2BC4B4); color:#fff; border-radius:22px; padding:18px 20px\">\n                <span style=\"display:block; font-family:'Fredoka', 'Figtree', sans-serif; font-size:20px; font-weight:600\">💜 A note for you, Ted<\u002Fspan>\n                <span style=\"display:block; font-size:16px; line-height:1.6; margin-top:6px; text-wrap:pretty\">{{ tdNote }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <p style=\"font-size:13px; font-weight:700; margin:12px 0 0; color:#7B4FD6\">{{ tdSaved }}<\u002Fp>\n          <\u002Fdiv>\n          <sc-if value=\"{{ hasTdPast }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"margin-top:20px; max-width:720px\">\n              <h3 style=\"font-family:'Fredoka', 'Figtree', sans-serif; font-size:20px; font-weight:600; margin:0; color:#14786F\">Past days<\u002Fh3>\n              <div style=\"display:grid; gap:8px; margin-top:10px\">\n                <sc-for list=\"{{ tdPast }}\" as=\"p\" hint-placeholder-count=\"2\">\n                  <div style=\"background:#C9F4F1; border-radius:18px; padding:12px 16px\">\n                    <span style=\"display:block; font-size:13px; font-weight:800; color:#14786F\">{{ p.label }}<\u002Fspan>\n                    <span style=\"display:block; font-size:15px; line-height:1.5; margin-top:4px\">{{ p.text }}<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ tedTabWants }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"margin-top:20px; max-width:720px; background:#EDE3FF; border-radius:28px; padding:clamp(18px,3vw,28px)\">\n            <h2 style=\"font-family:'Fredoka', 'Figtree', sans-serif; font-size:26px; font-weight:600; margin:0; color:#5B3FA8\">✨ Things I want to do<\u002Fh2>\n            <p style=\"font-size:14.5px; line-height:1.5; margin:6px 0 0; color:#5B3FA8\">Not jobs. Fun stuff and big ideas!<\u002Fp>\n            <div style=\"display:grid; gap:8px; margin-top:14px\">\n              <sc-for list=\"{{ tedWants }}\" as=\"w\" hint-placeholder-count=\"2\">\n                <div style=\"display:flex; gap:10px; align-items:center; background:#fff; border-radius:16px; padding:11px 14px; opacity:{{ w.op }}\">\n                  <button type=\"button\" aria-label=\"Did it\" style=\"flex:none; width:26px; height:26px; border-radius:50%; border:2px solid #7B4FD6; background:{{ w.fill }}; color:#fff; cursor:pointer; padding:0; font-size:13px; font-weight:800\" sc-camel-on-click=\"{{ w.toggle }}\">{{ w.mark }}<\u002Fbutton>\n                  <div style=\"flex:1; min-width:0\"><span style=\"display:block; font-size:16px; font-weight:600; text-decoration:{{ w.deco }}\">{{ w.text }}<\u002Fspan><span style=\"display:block; font-size:12.5px; font-weight:700; color:#7B4FD6\">{{ w.sub }}<\u002Fspan><\u002Fdiv>\n                  <button type=\"button\" aria-label=\"Remove\" style=\"flex:none; border:0; background:transparent; color:var(--mute); cursor:pointer; font-size:15px\" sc-camel-on-click=\"{{ w.remove }}\">×<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"display:flex; gap:8px; align-items:flex-end; margin-top:12px\">\n              <input style=\"flex:1; min-width:0; font-size:15px; padding:8px 0; border:0; border-bottom:2px solid rgba(20,120,111,.3); background:transparent; color:var(--ink); outline:none\" placeholder=\"e.g. Make a friendship SMP for Asher’s going-away day\" value=\"{{ tWant }}\" sc-camel-on-change=\"{{ setTWant }}\" sc-camel-on-key-down=\"{{ tWantKey }}\">\n              <button type=\"button\" style=\"flex:none; font-size:13px; font-weight:700; padding:7px 14px; border-radius:999px; border:0; background:#7B4FD6; color:#fff; cursor:pointer\" sc-camel-on-click=\"{{ tWantAdd }}\">Add<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ tedTabWish }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"margin-top:20px; max-width:720px; background:#C9F4F1; border-radius:28px; padding:clamp(18px,3vw,28px)\">\n            <h2 style=\"font-family:'Fredoka', 'Figtree', sans-serif; font-size:26px; font-weight:600; margin:0; color:#14786F\">🎁 My wishlist<\u002Fh2>\n            <div style=\"display:grid; gap:8px; margin-top:14px\">\n              <sc-for list=\"{{ tedWish }}\" as=\"w\" hint-placeholder-count=\"2\">\n                <div style=\"display:flex; gap:10px; align-items:center; background:#fff; border-radius:16px; padding:11px 14px; opacity:{{ w.op }}\">\n                  <span style=\"flex:none; font-size:20px\">🎁<\u002Fspan>\n                  <div style=\"flex:1; min-width:0\"><span style=\"display:block; font-size:16px; font-weight:600; text-decoration:{{ w.deco }}\">{{ w.name }}<\u002Fspan>\n                    <sc-if value=\"{{ w.hasUrl }}\" hint-placeholder-val=\"{{ false }}\"><a href=\"{{ w.url }}\" target=\"_blank\" rel=\"noopener noreferrer\" style=\"font-size:12.5px; font-weight:700; color:#14786F; text-decoration:none\">Open link ↗<\u002Fa><\u002Fsc-if>\n                  <\u002Fdiv>\n                  <button type=\"button\" style=\"flex:none; font-size:12.5px; font-weight:700; padding:6px 10px; border-radius:999px; border:0; background:#C9F4F1; color:#14786F; cursor:pointer; white-space:nowrap\" sc-camel-on-click=\"{{ w.toggle }}\">{{ w.gotLabel }}<\u002Fbutton>\n                  <button type=\"button\" aria-label=\"Remove\" style=\"flex:none; border:0; background:transparent; color:var(--mute); cursor:pointer; font-size:15px\" sc-camel-on-click=\"{{ w.remove }}\">×<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"display:flex; gap:8px 10px; flex-wrap:wrap; align-items:flex-end; margin-top:12px\">\n              <input style=\"flex:2 1 180px; min-width:0; font-size:15px; padding:8px 0; border:0; border-bottom:2px solid rgba(20,120,111,.3); background:transparent; color:var(--ink); outline:none\" placeholder=\"What would you love?\" value=\"{{ tWishName }}\" sc-camel-on-change=\"{{ setTWishName }}\" sc-camel-on-key-down=\"{{ tWishKey }}\">\n              <input style=\"flex:1 1 140px; min-width:0; font-size:15px; padding:8px 0; border:0; border-bottom:2px solid rgba(20,120,111,.3); background:transparent; color:var(--ink); outline:none\" placeholder=\"Link (optional)\" value=\"{{ tWishUrl }}\" sc-camel-on-change=\"{{ setTWishUrl }}\" sc-camel-on-key-down=\"{{ tWishKey }}\">\n              <button type=\"button\" style=\"flex:none; font-size:13px; font-weight:700; padding:7px 14px; border-radius:999px; border:0; background:#14786F; color:#fff; cursor:pointer\" sc-camel-on-click=\"{{ tWishAdd }}\">Add<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ tedTabMenu }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-top:20px\">\n            <button type=\"button\" aria-label=\"Previous week\" style=\"width:36px; height:36px; border-radius:50%; border:0; background:#EDE3FF; color:#5B3FA8; cursor:pointer; font-size:17px; font-weight:700\" sc-camel-on-click=\"{{ menuPrev }}\">‹<\u002Fbutton>\n            <h2 style=\"font-family:'Fredoka', 'Figtree', sans-serif; font-size:24px; font-weight:600; margin:0; color:#5B3FA8\">🍽️ {{ menuTitle }}<\u002Fh2>\n            <button type=\"button\" aria-label=\"Next week\" style=\"width:36px; height:36px; border-radius:50%; border:0; background:#EDE3FF; color:#5B3FA8; cursor:pointer; font-size:17px; font-weight:700\" sc-camel-on-click=\"{{ menuNext }}\">›<\u002Fbutton>\n          <\u002Fdiv>\n          <div style=\"display:grid; grid-template-columns:repeat(auto-fit, minmax(min(100%, 320px), 1fr)); gap:20px; margin-top:14px; align-items:start\">\n            <div style=\"display:grid; gap:12px\">\n              <p style=\"font-size:14.5px; line-height:1.5; margin:0; color:#5B3FA8\">Mum writes three ideas for each meal. Ted, tick the ones you want this week, or type your own in “Other”! ✅<\u002Fp>\n              <sc-for list=\"{{ menuMeals }}\" as=\"m\" hint-placeholder-count=\"3\">\n                <div style=\"background:{{ m.bg }}; border-radius:22px; padding:16px 18px\">\n                  <span style=\"display:block; font-family:'Fredoka', 'Figtree', sans-serif; font-size:19px; font-weight:600; color:{{ m.deep }}\">{{ m.label }}<\u002Fspan>\n                  <div style=\"display:grid; gap:6px; margin-top:8px\">\n                    <sc-for list=\"{{ m.opts }}\" as=\"o\" hint-placeholder-count=\"3\">\n                      <div style=\"display:flex; gap:10px; align-items:center; background:#fff; border-radius:14px; padding:8px 12px\">\n                        <button type=\"button\" aria-label=\"Pick this\" style=\"flex:none; width:26px; height:26px; border-radius:8px; border:2px solid {{ m.deep }}; background:{{ o.fill }}; color:#fff; cursor:pointer; padding:0; font-size:14px; font-weight:800\" sc-camel-on-click=\"{{ o.toggle }}\">{{ o.mark }}<\u002Fbutton>\n                        <input style=\"flex:1; min-width:0; font-size:15px; font-weight:600; padding:4px 0; border:0; background:transparent; color:var(--ink); outline:none\" placeholder=\"{{ o.ph }}\" value=\"{{ o.text }}\" sc-camel-on-change=\"{{ o.setText }}\">\n                      <\u002Fdiv>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fsection>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ pageItta }}\" hint-placeholder-val=\"{{ false }}\">\n      <section style=\"padding:clamp(28px,4vw,48px) 0 0\">\n        <h1 style=\"font-family:'Fredoka', 'Figtree', sans-serif; font-size:clamp(40px,6vw,72px); line-height:1; font-weight:600; letter-spacing:-0.02em; margin:0\">🎓 ITTA<\u002Fh1>\n        <p style=\"font-family:'Fredoka', 'Figtree', sans-serif; font-size:19px; line-height:1.5; margin:14px 0 0; color:var(--mute)\">{{ ittaSummary }}<\u002Fp>\n        <button type=\"button\" style=\"margin-top:14px; font-size:13px; font-weight:700; padding:7px 14px; border-radius:999px; border:0; background:var(--peach); color:var(--peachd); cursor:pointer\" sc-camel-on-click=\"{{ ittaToggleHide }}\">{{ ittaHideLabel }}<\u002Fbutton>\n        <div style=\"display:grid; grid-template-columns:repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap:20px; margin-top:24px; align-items:start\">\n          <sc-for list=\"{{ ittaCols }}\" as=\"col\" hint-placeholder-count=\"2\">\n            <div style=\"min-width:0; background:{{ col.bg }}; border-radius:28px; padding:22px\">\n              <div style=\"display:flex; justify-content:space-between; align-items:baseline; gap:4px 12px; flex-wrap:wrap\">\n                <h2 style=\"font-family:'Fredoka', 'Figtree', sans-serif; font-size:24px; font-weight:600; margin:0; color:{{ col.deep }}\">{{ col.title }}<\u002Fh2>\n                <span style=\"font-size:13px; font-weight:700; color:{{ col.deep }}\">{{ col.progress }}<\u002Fspan>\n              <\u002Fdiv>\n              <span style=\"display:block; font-size:13px; font-weight:600; margin-top:4px; color:{{ col.deep }}\">{{ col.mix }}<\u002Fspan>\n              <div style=\"height:10px; border-radius:10px; background:rgba(255,255,255,.7); overflow:hidden; margin-top:12px\">\n                <div style=\"height:100%; width:{{ col.pct }}; border-radius:10px; background:{{ col.deep }}\"><\u002Fdiv>\n              <\u002Fdiv>\n              <sc-if value=\"{{ col.allDone }}\" hint-placeholder-val=\"{{ false }}\">\n                <p style=\"font-size:15px; font-weight:700; margin:14px 0 0; color:{{ col.deep }}\">All done 🎉<\u002Fp>\n              <\u002Fsc-if>\n              <div style=\"display:grid; gap:6px; margin-top:14px\">\n                <sc-for list=\"{{ col.items }}\" as=\"it\" hint-placeholder-count=\"8\">\n                  <button type=\"button\" style=\"display:flex; gap:12px; align-items:center; text-align:left; width:100%; background:rgba(255,255,255,.78); border-radius:16px; padding:10px 12px; border:0; cursor:pointer; color:var(--ink); opacity:{{ it.op }}\" sc-camel-on-click=\"{{ it.toggle }}\">\n                    <span style=\"flex:none; width:22px; height:22px; border-radius:50%; border:2px solid {{ col.deep }}; background:{{ it.fill }}; color:#fff; display:grid; place-items:center; font-size:12px; font-weight:800\">{{ it.mark }}<\u002Fspan>\n                    <span style=\"flex:none; font-size:16px\" title=\"{{ it.kind }}\">{{ it.icon }}<\u002Fspan>\n                    <span style=\"flex:1; min-width:0; font-size:15px; font-weight:600; line-height:1.35; text-decoration:{{ it.deco }}\">{{ it.rest }}<\u002Fspan>\n                  <\u002Fbutton>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsection>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ pageReading }}\" hint-placeholder-val=\"{{ false }}\">\n      <section style=\"padding:clamp(28px,4vw,48px) 0 0; max-width:820px\">\n        <h1 style=\"font-family:'Fredoka', 'Figtree', sans-serif; font-size:clamp(40px,6vw,72px); line-height:1; font-weight:600; letter-spacing:-0.02em; margin:0\">📚 Reading list<\u002Fh1>\n        <p style=\"font-family:'Fredoka', 'Figtree', sans-serif; font-size:19px; margin:14px 0 0; color:var(--mute)\">{{ readingSummary }}<\u002Fp>\n        <div style=\"margin-top:24px; background:var(--paper); border-radius:28px; padding:6px 24px\">\n          <sc-for list=\"{{ reading }}\" as=\"r\" hint-placeholder-count=\"2\">\n            <div style=\"display:flex; gap:16px; align-items:baseline; padding:16px 0; border-bottom:1px solid var(--rule)\">\n              <div style=\"flex:1; min-width:0\">\n                <span style=\"display:block; font-size:11px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--accent)\">{{ r.topic }} · {{ r.source }}<\u002Fspan>\n                <a href=\"{{ r.url }}\" target=\"_blank\" rel=\"noopener noreferrer\" style=\"display:block; font-family:'Fredoka', 'Figtree', sans-serif; font-size:22px; line-height:1.25; margin-top:4px; color:var(--ink); text-decoration:none\">{{ r.headline }} ↗<\u002Fa>\n              <\u002Fdiv>\n              <button type=\"button\" style=\"flex:none; border:0; background:transparent; color:var(--mute); cursor:pointer; font-size:12px; font-weight:700\" sc-camel-on-click=\"{{ r.remove }}\">Remove<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsection>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ pageWishlist }}\" hint-placeholder-val=\"{{ false }}\">\n      <section style=\"padding:clamp(28px,4vw,48px) 0 0\">\n        <h1 style=\"font-family:'Fredoka', 'Figtree', sans-serif; font-size:clamp(40px,6vw,72px); line-height:1; font-weight:600; letter-spacing:-0.02em; margin:0\">🛍️ Wishlist<\u002Fh1>\n        <p style=\"font-family:'Fredoka', 'Figtree', sans-serif; font-size:19px; margin:14px 0 0; color:var(--mute)\">{{ wishSummary }}<\u002Fp>\n        <div style=\"display:flex; gap:12px 18px; flex-wrap:wrap; align-items:flex-end; margin-top:24px; padding:18px; background:var(--butter); border-radius:28px\">\n          <input style=\"flex:2 1 200px; min-width:0; font-size:16px; padding:8px 0; border:0; border-bottom:1px solid var(--ink); background:transparent; color:var(--ink); outline:none\" placeholder=\"What is it?\" value=\"{{ wName }}\" sc-camel-on-change=\"{{ setWName }}\" sc-camel-on-key-down=\"{{ wishKey }}\">\n          <input type=\"url\" style=\"flex:2 1 200px; min-width:0; font-size:16px; padding:8px 0; border:0; border-bottom:1px solid var(--rule); background:transparent; color:var(--ink); outline:none\" placeholder=\"Paste the link\" value=\"{{ wUrl }}\" sc-camel-on-change=\"{{ setWUrl }}\" sc-camel-on-key-down=\"{{ wishKey }}\">\n          <input inputmode=\"decimal\" style=\"flex:1 1 90px; min-width:0; font-size:16px; padding:8px 0; border:0; border-bottom:1px solid var(--rule); background:transparent; color:var(--ink); outline:none\" placeholder=\"Price\" value=\"{{ wPrice }}\" sc-camel-on-change=\"{{ setWPrice }}\" sc-camel-on-key-down=\"{{ wishKey }}\">\n          <div style=\"display:flex; gap:4px\">\n            <sc-for list=\"{{ wishTags }}\" as=\"o\" hint-placeholder-count=\"3\">\n              <button type=\"button\" style=\"font-size:13px; font-weight:700; padding:7px 12px; border-radius:999px; border:0; cursor:pointer; background:{{ o.bg }}; color:{{ o.color }}\" sc-camel-on-click=\"{{ o.pick }}\">{{ o.label }}<\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <button type=\"button\" style=\"font-size:14px; font-weight:700; padding:9px 18px; border-radius:999px; border:0; background:var(--accent); color:#fff; cursor:pointer\" sc-camel-on-click=\"{{ addWish }}\">Add<\u002Fbutton>\n        <\u002Fdiv>\n        <div style=\"display:flex; gap:4px 18px; flex-wrap:wrap; margin-top:24px\">\n          <sc-for list=\"{{ wishFilters }}\" as=\"f\" hint-placeholder-count=\"5\">\n            <button type=\"button\" style=\"font-family:'Fredoka', 'Figtree', sans-serif; font-size:17px; padding:2px 0; border:0; cursor:pointer; background:transparent; color:{{ f.color }}; font-style:{{ f.fstyle }}\" sc-camel-on-click=\"{{ f.pick }}\">{{ f.label }}<\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <sc-if value=\"{{ noWishes }}\" hint-placeholder-val=\"{{ false }}\">\n          <p style=\"font-family:'Fredoka', 'Figtree', sans-serif; font-size:18px; margin:20px 0 0; color:var(--mute)\">Nothing here.<\u002Fp>\n        <\u002Fsc-if>\n        <div style=\"margin-top:12px; background:var(--paper); border-radius:28px; padding:6px 24px\">\n          <sc-for list=\"{{ wishes }}\" as=\"w\" hint-placeholder-count=\"3\">\n            <div style=\"display:grid; grid-template-columns:minmax(0,1fr) auto; gap:8px 20px; align-items:baseline; padding:16px 0; border-bottom:1px solid var(--rule); opacity:{{ w.op }}\">\n              <div style=\"min-width:0\">\n                <span style=\"display:block; font-size:11px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--accent)\">{{ w.tag }} · {{ w.domain }}<\u002Fspan>\n                <span style=\"display:block; font-family:'Fredoka', 'Figtree', sans-serif; font-size:22px; line-height:1.25; margin-top:4px; text-decoration:{{ w.deco }}\">{{ w.name }}<\u002Fspan>\n                <div style=\"display:flex; gap:16px; flex-wrap:wrap; margin-top:8px\">\n                  <sc-if value=\"{{ w.hasUrl }}\" hint-placeholder-val=\"{{ true }}\">\n                    <a href=\"{{ w.url }}\" target=\"_blank\" rel=\"noopener noreferrer\" style=\"font-size:13px; font-weight:700; color:var(--accent); text-decoration:none\">Open link ↗<\u002Fa>\n                  <\u002Fsc-if>\n                  <button type=\"button\" style=\"font-size:13px; font-weight:700; padding:0; border:0; background:transparent; color:var(--ink); cursor:pointer\" sc-camel-on-click=\"{{ w.toggle }}\">{{ w.boughtLabel }}<\u002Fbutton>\n                  <button type=\"button\" style=\"font-size:13px; font-weight:600; padding:0; border:0; background:transparent; color:var(--mute); cursor:pointer\" sc-camel-on-click=\"{{ w.remove }}\">Remove<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <span style=\"font-family:'Fredoka', 'Figtree', sans-serif; font-size:22px\">{{ w.priceLabel }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsection>\n<\u002Fsc-if>\n\n\n<sc-if value=\"{{ pageSync }}\" hint-placeholder-val=\"{{ false }}\">\n      <section style=\"padding:clamp(28px,4vw,48px) 0 0; max-width:760px\">\n        <h1 style=\"font-family:'Fredoka', 'Figtree', sans-serif; font-size:clamp(36px,5vw,56px); line-height:1.05; font-weight:600; letter-spacing:-0.02em; margin:0\">☁️ Sync &amp; backup<\u002Fh1>\n        <p style=\"font-family:'Fredoka', 'Figtree', sans-serif; font-size:18px; line-height:1.5; margin:12px 0 0; color:var(--mute)\">Use the same planner on your work laptop, school laptop and phone.<\u002Fp>\n        <div style=\"margin-top:22px; background:var(--paper); border-radius:28px; padding:24px; box-shadow:0 1px 0 var(--rule), 0 14px 34px -26px rgba(120,40,70,.35)\">\n          <div style=\"display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap\">\n            <h2 style=\"font-family:'Fredoka', 'Figtree', sans-serif; font-size:22px; font-weight:600; margin:0\">🔄 Sync between devices<\u002Fh2>\n            <span style=\"font-size:13px; font-weight:800; padding:6px 12px; border-radius:999px; background:{{ syncChipBg }}; color:{{ syncChipColor }}\">{{ syncChip }}<\u002Fspan>\n          <\u002Fdiv>\n          <sc-if value=\"{{ syncOn }}\" hint-placeholder-val=\"{{ false }}\">\n            <p style=\"font-size:15px; line-height:1.55; margin:12px 0 0\">{{ syncLine }}<\u002Fp>\n            <div style=\"display:flex; gap:8px; flex-wrap:wrap; margin-top:14px\">\n              <button type=\"button\" style=\"font-size:14px; font-weight:700; padding:10px 18px; border-radius:999px; border:0; cursor:pointer; background:var(--accent); color:#fff\" sc-camel-on-click=\"{{ syncNow }}\">🔄 Sync now<\u002Fbutton>\n              <button type=\"button\" style=\"font-size:14px; font-weight:700; padding:10px 18px; border-radius:999px; border:0; cursor:pointer; background:var(--soft); color:var(--ink)\" sc-camel-on-click=\"{{ syncOff }}\">Disconnect this device<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ syncOffNow }}\" hint-placeholder-val=\"{{ true }}\">\n            <p style=\"font-size:15px; line-height:1.55; margin:12px 0 0\">Your planner saves to a private file in your GitHub account, and every device you connect reads from it. Do this once on each laptop:<\u002Fp>\n            <ol style=\"font-size:15px; line-height:1.6; margin:12px 0 0; padding-left:22px; display:grid; gap:6px\">\n              <li><a href=\"https://github.com/settings/tokens/new?scopes=gist&amp;description=Good%20Morning%20Tahni\" target=\"_blank\" rel=\"noopener noreferrer\" style=\"font-weight:700\">Open this GitHub page ↗<\u002Fa> (sign in if asked). The name is filled in and only <strong>gist<\u002Fstrong> is ticked.<\u002Fli>\n              <li>Set <strong>Expiration<\u002Fstrong> to <strong>No expiration<\u002Fstrong>, scroll down and click <strong>Generate token<\u002Fstrong>.<\u002Fli>\n              <li>Copy the token (it starts with <strong>ghp_<\u002Fstrong>) and paste it below. You can reuse the same token on your other laptop, or make a new one.<\u002Fli>\n            <\u002Fol>\n            <div style=\"display:flex; gap:8px; flex-wrap:wrap; margin-top:14px\">\n              <input type=\"password\" autocomplete=\"off\" style=\"flex:1 1 260px; min-width:0; font-size:15px; padding:10px 14px; border-radius:14px; border:2px solid var(--rule); background:#fff; color:var(--ink); outline:none\" placeholder=\"Paste your token (ghp_…)\" value=\"{{ syncTok }}\" sc-camel-on-change=\"{{ setSyncTok }}\" sc-camel-on-key-down=\"{{ syncKey }}\">\n              <button type=\"button\" style=\"font-size:14px; font-weight:700; padding:10px 18px; border-radius:999px; border:0; cursor:pointer; background:var(--accent); color:#fff; opacity:{{ syncBusyOp }}\" sc-camel-on-click=\"{{ syncConnect }}\">Connect<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ hasSyncMsg }}\" hint-placeholder-val=\"{{ false }}\">\n            <p style=\"font-size:14px; font-weight:700; line-height:1.5; margin:14px 0 0; padding:10px 14px; border-radius:14px; background:{{ syncMsgBg }}; color:{{ syncMsgColor }}\">{{ syncMsg }}<\u002Fp>\n          <\u002Fsc-if>\n          <p style=\"font-size:13px; line-height:1.55; margin:14px 0 0; color:var(--mute)\">The token only lets the site read and write your gists, a separate notes area of GitHub, not your repos. It stays on this device. If both laptops are open, the most recent change wins, so let one sync before you switch.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"margin-top:18px; background:var(--paper); border-radius:28px; padding:24px; box-shadow:0 1px 0 var(--rule), 0 14px 34px -26px rgba(120,40,70,.35)\">\n          <h2 style=\"font-family:'Fredoka', 'Figtree', sans-serif; font-size:22px; font-weight:600; margin:0\">💾 Backup file<\u002Fh2>\n          <p style=\"font-size:15px; line-height:1.55; margin:10px 0 0\">Keep a copy of everything, just in case. Loading a backup replaces what’s on this device.<\u002Fp>\n          <div style=\"display:flex; gap:8px; flex-wrap:wrap; margin-top:14px\">\n            <button type=\"button\" style=\"font-size:14px; font-weight:700; padding:10px 18px; border-radius:999px; border:0; cursor:pointer; background:var(--mint); color:var(--mintd)\" sc-camel-on-click=\"{{ backupDown }}\">⬇️ Download my data<\u002Fbutton>\n            <label style=\"font-size:14px; font-weight:700; padding:10px 18px; border-radius:999px; border:0; cursor:pointer; background:var(--lilac); color:var(--lilacd); display:inline-flex; align-items:center\">⬆️ Load my data<input type=\"file\" accept=\".json,application/json\" style=\"display:none\" sc-camel-on-change=\"{{ backupUp }}\"><\u002Flabel>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ pageMemory }}\" hint-placeholder-val=\"{{ false }}\">\n      <section style=\"padding:clamp(28px,4vw,48px) 0 0; max-width:860px\">\n        <span style=\"font-size:11.5px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--mute)\">Memory<\u002Fspan>\n        <h1 style=\"font-family:'Fredoka', 'Figtree', sans-serif; font-size:clamp(40px,6vw,72px); line-height:1; font-weight:600; letter-spacing:-0.02em; margin:10px 0 0\">🧠 What I remember<\u002Fh1>\n        <p style=\"font-family:'Fredoka', 'Figtree', sans-serif; font-size:19px; line-height:1.55; margin:14px 0 0; color:var(--mute)\">Everything here is stored only in this browser. Change or remove anything that’s wrong.<\u002Fp>\n\n        <div id=\"alert\" style=\"margin-top:28px; background:var(--butter); border-radius:28px; padding:24px\">\n          <h2 style=\"font-family:'Fredoka', 'Figtree', sans-serif; font-size:26px; font-weight:600; margin:0; color:var(--butterd)\">⏰ Morning alert<\u002Fh2>\n          <p style=\"font-size:15px; line-height:1.5; margin:6px 0 0; color:var(--butterd)\">A daily nudge to read your morning edition.<\u002Fp>\n          <div style=\"display:flex; gap:12px 16px; flex-wrap:wrap; align-items:flex-end; margin-top:14px\">\n            <label style=\"display:grid; gap:4px; font-size:12px; font-weight:700; color:var(--butterd)\">Time<input type=\"time\" style=\"font-size:15px; padding:8px 10px; border-radius:12px; border:0; background:#fff; color:var(--ink)\" value=\"{{ alertTime }}\" sc-camel-on-change=\"{{ setAlertTime }}\"><\u002Flabel>\n            <button type=\"button\" style=\"font-size:14px; font-weight:700; padding:10px 16px; border-radius:999px; border:0; background:var(--accent); color:#fff; cursor:pointer\" sc-camel-on-click=\"{{ downloadAlert }}\">📱 Add to my phone’s calendar<\u002Fbutton>\n            <button type=\"button\" style=\"font-size:14px; font-weight:700; padding:10px 16px; border-radius:999px; border:0; background:#fff; color:var(--butterd); cursor:pointer\" sc-camel-on-click=\"{{ toggleBrowserAlert }}\">{{ browserAlertLabel }}<\u002Fbutton>\n          <\u002Fdiv>\n          <p style=\"font-size:13px; line-height:1.5; margin:12px 0 0; color:var(--butterd)\">{{ alertNote }}<\u002Fp>\n        <\u002Fdiv>\n\n        <div style=\"margin-top:36px; background:var(--paper); border-radius:28px; padding:24px; box-shadow:0 1px 0 var(--rule), 0 14px 34px -26px rgba(120,40,70,.35)\">\n          <h2 style=\"font-family:'Fredoka', 'Figtree', sans-serif; font-size:28px; font-weight:600; margin:0\">Your interests<\u002Fh2>\n          <p style=\"font-size:14px; margin:6px 0 0; color:var(--mute)\">Tap to mute or follow. Counts show what you’ve opened, saved or skipped.<\u002Fp>\n          <div style=\"display:flex; flex-wrap:wrap; gap:8px; margin-top:14px\">\n            <sc-for list=\"{{ topics }}\" as=\"t\" hint-placeholder-count=\"10\">\n              <button type=\"button\" style=\"font-size:14px; font-weight:600; padding:7px 13px; border-radius:999px; border:1px solid {{ t.border }}; cursor:pointer; background:{{ t.bg }}; color:{{ t.color }}; text-decoration:{{ t.deco }}\" sc-camel-on-click=\"{{ t.toggle }}\">{{ t.label }}<\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <sc-if value=\"{{ hasSuggest }}\" hint-placeholder-val=\"{{ false }}\">\n            <p style=\"font-family:'Fredoka', 'Figtree', sans-serif; font-size:17px; margin:14px 0 0; color:var(--accent)\">{{ suggestLine }}<\u002Fp>\n          <\u002Fsc-if>\n          <div style=\"display:flex; gap:12px; align-items:flex-end; margin-top:16px; max-width:480px\">\n            <input style=\"flex:1; min-width:0; font-size:15px; padding:8px 0; border:0; border-bottom:1px solid var(--ink); background:transparent; color:var(--ink); outline:none\" placeholder=\"Follow a new topic\" value=\"{{ newTopic }}\" sc-camel-on-change=\"{{ setNewTopic }}\" sc-camel-on-key-down=\"{{ topicKey }}\">\n            <button type=\"button\" style=\"font-size:13px; font-weight:700; padding:6px 0; border:0; background:transparent; color:var(--accent); cursor:pointer\" sc-camel-on-click=\"{{ addTopic }}\">Follow<\u002Fbutton>\n          <\u002Fdiv>\n          <button type=\"button\" style=\"margin-top:12px; font-size:13px; font-weight:700; padding:0; border:0; background:transparent; color:var(--mute); cursor:pointer\" sc-camel-on-click=\"{{ resetSignals }}\">Forget my reading history<\u002Fbutton>\n        <\u002Fdiv>\n\n        <div style=\"margin-top:40px; background:var(--paper); border-radius:28px; padding:24px; box-shadow:0 1px 0 var(--rule), 0 14px 34px -26px rgba(120,40,70,.35)\">\n          <h2 style=\"font-family:'Fredoka', 'Figtree', sans-serif; font-size:28px; font-weight:600; margin:0\">Food<\u002Fh2>\n          <p style=\"font-size:14px; margin:6px 0 0; color:var(--mute)\">Recipes containing these words won’t be suggested.<\u002Fp>\n          <div style=\"display:flex; flex-wrap:wrap; gap:8px; margin-top:12px\">\n            <sc-for list=\"{{ avoidList }}\" as=\"a\" hint-placeholder-count=\"0\">\n              <button type=\"button\" style=\"font-size:14px; font-weight:600; padding:6px 12px; border-radius:999px; border:0; background:var(--pink); color:var(--pinkd); cursor:pointer\" sc-camel-on-click=\"{{ a.remove }}\">{{ a.label }} ×<\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"display:flex; gap:12px; align-items:flex-end; margin-top:12px; max-width:480px\">\n            <input style=\"flex:1; min-width:0; font-size:15px; padding:8px 0; border:0; border-bottom:1px solid var(--ink); background:transparent; color:var(--ink); outline:none\" placeholder=\"Never suggest, e.g. mushroom\" value=\"{{ fAvoid }}\" sc-camel-on-change=\"{{ setFAvoid }}\" sc-camel-on-key-down=\"{{ avoidKey }}\">\n            <button type=\"button\" style=\"font-size:13px; font-weight:700; padding:6px 0; border:0; background:transparent; color:var(--accent); cursor:pointer\" sc-camel-on-click=\"{{ addAvoid }}\">Add<\u002Fbutton>\n          <\u002Fdiv>\n          <div style=\"margin-top:16px\">\n            <sc-for list=\"{{ fridgeList }}\" as=\"f\" hint-placeholder-count=\"0\">\n              <div style=\"display:flex; gap:12px; align-items:baseline; padding:8px 0; border-bottom:1px solid var(--rule)\">\n                <span style=\"flex:none; width:90px; font-size:12px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--mute)\">{{ f.label }}<\u002Fspan>\n                <span style=\"flex:1; font-size:15px\">{{ f.text }}<\u002Fspan>\n                <button type=\"button\" style=\"border:0; background:transparent; color:var(--mute); cursor:pointer; font-size:12px; font-weight:700\" sc-camel-on-click=\"{{ f.remove }}\">Remove<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"margin-top:40px; background:var(--paper); border-radius:28px; padding:24px; box-shadow:0 1px 0 var(--rule), 0 14px 34px -26px rgba(120,40,70,.35)\">\n          <h2 style=\"font-family:'Fredoka', 'Figtree', sans-serif; font-size:28px; font-weight:600; margin:0\">Your notes<\u002Fh2>\n          <p style=\"font-size:14px; margin:6px 0 0; color:var(--mute)\">Morning prompts and evening brain dumps.<\u002Fp>\n          <div style=\"margin-top:10px\">\n            <sc-for list=\"{{ notesList }}\" as=\"n\" hint-placeholder-count=\"0\">\n              <div style=\"display:flex; gap:12px; align-items:baseline; padding:10px 0; border-bottom:1px solid var(--rule)\">\n                <span style=\"flex:none; width:90px; font-size:12px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--mute)\">{{ n.label }}<\u002Fspan>\n                <span style=\"flex:1; min-width:0; font-family:'Fredoka', 'Figtree', sans-serif; font-size:16px; line-height:1.5\">{{ n.text }}<\u002Fspan>\n                <button type=\"button\" style=\"border:0; background:transparent; color:var(--mute); cursor:pointer; font-size:12px; font-weight:700\" sc-camel-on-click=\"{{ n.remove }}\">Remove<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n<\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fmain>\n<\u002Fdiv>\n\n  <button type=\"button\" aria-label=\"Parking lot\" style=\"position:fixed; right:20px; bottom:20px; z-index:45; display:flex; align-items:center; gap:8px; font-size:15px; font-weight:700; padding:14px 18px; border-radius:999px; border:0; background:var(--accent); color:#fff; cursor:pointer; box-shadow:0 12px 30px -10px rgba(214,58,114,.65)\" sc-camel-on-click=\"{{ plToggle }}\">🅿️ <span>Park a thought<\u002Fspan>\n    <sc-if value=\"{{ hasPl }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"min-width:22px; height:22px; border-radius:11px; background:#fff; color:var(--accent); font-size:12px; font-weight:800; display:grid; place-items:center; padding:0 6px; box-sizing:border-box\">{{ plCount }}<\u002Fspan><\u002Fsc-if>\n  <\u002Fbutton>\n  <sc-if value=\"{{ plOpen }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:fixed; right:20px; bottom:84px; z-index:46; width:min(380px, calc(100vw - 40px)); max-height:min(70vh, 560px); overflow:auto; box-sizing:border-box; background:var(--paper); border-radius:26px; padding:20px; box-shadow:0 30px 70px -24px rgba(59,42,51,.45)\" role=\"dialog\" aria-label=\"Parking lot\">\n      <div style=\"display:flex; justify-content:space-between; align-items:center; gap:10px\">\n        <h3 style=\"font-family:'Fredoka', 'Figtree', sans-serif; font-size:22px; font-weight:600; margin:0\">🅿️ Parking lot<\u002Fh3>\n        <button type=\"button\" style=\"font-size:13px; font-weight:700; padding:0; border:0; background:transparent; color:var(--mute); cursor:pointer\" sc-camel-on-click=\"{{ plToggle }}\">Close<\u002Fbutton>\n      <\u002Fdiv>\n      <p style=\"font-size:14px; line-height:1.45; margin:4px 0 0; color:var(--mute)\">Park it here and get back to what you were doing. Sort it later.<\u002Fp>\n      <div style=\"display:flex; gap:8px; align-items:flex-end; marg
