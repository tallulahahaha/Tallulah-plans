document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);

  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;

          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

{{ onboarding }}\" hint-placeholder-val=\"{{ false }}\">\n  <main style=\"max-width:640px; margin:0 auto; padding:clamp(40px,8vw,96px) 24px 80px\">\n    <div style=\"display:flex; align-items:baseline; justify-content:space-between; gap:12px; border-bottom:1px solid var(--ink); padding-bottom:12px\">\n      <span style=\"font-family:'Fredoka', 'Figtree', sans-serif; font-size:22px; font-weight:600\">Good Morning<\u002Fspan>\n      <span style=\"font-size:11.5px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--mute)\">{{ stepLabel }}<\u002Fspan>\n    <\u002Fdiv>\n    <h1 style=\"font-family:'Fredoka', 'Figtree', sans-serif; font-size:clamp(34px,6vw,52px); line-height:1.08; font-weight:600; letter-spacing:-0.01em; margin:40px 0 0\">{{ stepTitle }}<\u002Fh1>\n    <p style=\"font-family:'Fredoka', 'Figtree', sans-serif; font-size:20px; line-height:1.55; margin:14px 0 0; color:var(--mute)\">{{ stepIntro }}<\u002Fp>\n    <sc-if value=\"{{ obStep0 }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"display:grid; gap:22px; margin-top:32px\">\n        <label style=\"display:grid; gap:4px; font-size:13px; font-weight:700; color:var(--mute)\">Your name\n          <input style=\"font-size:18px; padding:10px 0; border:0; border-bottom:1px solid var(--ink); background:transparent; color:var(--ink); outline:none\" value=\"{{ draftName }}\" sc-camel-on-change=\"{{ setName }}\">\n        <\u002Flabel>\n        <label style=\"display:grid; gap:4px; font-size:13px; font-weight:700; color:var(--mute)\">Your town, for the weather\n          <input style=\"font-size:18px; padding:10px 0; border:0; border-bottom:1px solid var(--ink); background:transparent; color:var(--ink); outline:none\" placeholder=\"e.g. Newcastle\" value=\"{{ draftCity }}\" sc-camel-on-change=\"{{ setCity }}\">\n        <\u002Flabel>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n    <sc-if value=\"{{ obStep1 }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"display:flex; flex-wrap:wrap; gap:8px; margin-top:28px\">\n        <sc-for list=\"{{ obTopics }}\" as=\"t\" hint-placeholder-count=\"12\">\n          <button type=\"button\" style=\"font-size:14px; font-weight:600; padding:7px 13px; border-radius:999px; border:1px solid {{ t.border }}; cursor:pointer; background:{{ t.bg }}; color:{{ t.color }}; text-decoration:{{ t.deco }}\" sc-camel-on-click=\"{{ t.toggle }}\">{{ t.label }}<\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"display:flex; gap:12px; margin-top:24px; align-items:flex-end\">\n        <input style=\"flex:1; min-width:0; font-size:16px; padding:10px 0; border:0; border-bottom:1px solid var(--ink); background:transparent; color:var(--ink); outline:none\" placeholder=\"Add a topic, e.g. Ceramics\" value=\"{{ obTopic }}\" sc-camel-on-change=\"{{ setObTopic }}\" sc-camel-on-key-down=\"{{ obTopicKey }}\">\n        <button type=\"button\" style=\"font-size:14px; font-weight:700; padding:9px 16px; border-radius:999px; border:0; background:var(--pink); color:var(--pinkd); cursor:pointer\" sc-camel-on-click=\"{{ addObTopic }}\">Add<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n    <sc-if value=\"{{ obStep2 }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"display:grid; gap:26px; margin-top:32px\">\n        <sc-for list=\"{{ obGroups }}\" as=\"g\" hint-placeholder-count=\"2\">\n          <div>\n            <span style=\"display:block; font-size:13px; font-weight:700; color:var(--mute)\">{{ g.label }}<\u002Fspan>\n            <div style=\"display:flex; flex-wrap:wrap; gap:8px; margin-top:10px\">\n              <sc-for list=\"{{ g.opts }}\" as=\"o\" hint-placeholder-count=\"3\">\n                <button type=\"button\" style=\"font-size:15px; font-weight:600; padding:9px 16px; border-radius:999px; border:0; cursor:pointer; background:{{ o.bg }}; color:{{ o.color }}\" sc-camel-on-click=\"{{ o.pick }}\">{{ o.label }}<\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n    <div style=\"display:flex; gap:12px; align-items:center; margin-top:40px; flex-wrap:wrap\">\n      <button type=\"button\" style=\"font-size:15px; font-weight:700; padding:12px 22px; border-radius:999px; border:0; background:var(--accent); color:#fff; cursor:pointer\" sc-camel-on-click=\"{{ obNext }}\">{{ nextLabel }}<\u002Fbutton>\n      <sc-if value=\"{{ notFirst }}\" hint-placeholder-val=\"{{ false }}\">\n        <button type=\"button\" style=\"font-size:14px; font-weight:700; padding:8px 4px; border:0; background:transparent; color:var(--mute); cursor:pointer\" sc-camel-on-click=\"{{ obBack }}\">Back<\u002Fbutton>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ canCancel }}\" hint-placeholder-val=\"{{ false }}\">\n        <button type=\"button\" style=\"font-size:14px; font-weight:700; padding:8px 4px; border:0; background:transparent; color:var(--mute); cursor:pointer\" sc-camel-on-click=\"{{ cancelOb }}\">Cancel<\u002Fbutton>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fmain>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ daily }}\" hint-placeholder-val=\"{{ true }}\">\n<div style=\"display:flex; min-height:100vh\">\n  <sc-if value=\"{{ wide }}\" hint-placeholder-val=\"{{ true }}\">\n    <aside aria-label=\"Contents\" style=\"flex:none; width:210px; position:sticky; top:0; height:100vh; box-sizing:border-box; padding:44px 20px 32px 36px; overflow:auto\">\n      <span style=\"display:block; font-size:11.5px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--mute)\">Contents<\u002Fspan>\n      <div style=\"display:grid; gap:22px; margin-top:22px\">\n        <sc-for list=\"{{ navGroups }}\" as=\"g\" hint-placeholder-count=\"3\">\n          <div style=\"display:grid; gap:2px\">\n            <span style=\"font-size:11px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--mute); margin-bottom:4px\">{{ g.label }}<\u002Fspan>\n            <sc-for list=\"{{ g.items }}\" as=\"n\" hint-placeholder-count=\"3\">\n              <button type=\"button\" aria-current=\"{{ n.current }}\" style=\"text-align:left; font-family:'Fredoka', sans-serif; font-size:17px; font-weight:600; line-height:1.3; padding:7px 12px; margin-left:-12px; border-radius:14px; border:0; background:{{ n.bg }}; cursor:pointer; color:{{ n.color }}\" sc-camel-on-click=\"{{ n.go }}\">{{ n.label }}<\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Faside>\n  <\u002Fsc-if>\n\n  <main style=\"flex:1; min-width:0; padding:0 clamp(18px,4vw,56px) 96px\">\n    <div style=\"max-width:1120px; margin:0 auto\">\n      <header style=\"padding-top:clamp(18px,3vw,32px)\">\n        <div style=\"display:flex; align-items:center; justify-content:space-between; gap:14px 24px; flex-wrap:wrap\">\n          <button type=\"button\" style=\"font-family:'Fredoka', 'Figtree', sans-serif; font-size:clamp(22px,2.6vw,28px); font-weight:600; letter-spacing:-0.01em; padding:0; border:0; background:transparent; color:var(--ink); cursor:pointer\" sc-camel-on-click=\"{{ goToday }}\">☀️ Good Morning, {{ name }}<\u002Fbutton>\n          <div style=\"display:flex; align-items:center; gap:4px 16px; flex-wrap:wrap\">\n            <button type=\"button\" style=\"font-size:13px; font-weight:700; padding:6px 0; border:0; background:transparent; color:var(--mute); cursor:pointer; white-space:nowrap\" sc-camel-on-click=\"{{ goAlert }}\">⏰ Alert<\u002Fbutton>\n            <button type=\"button\" style=\"font-size:13px; font-weight:700; padding:6px 0; border:0; background:transparent; color:var(--mute); cursor:pointer\" sc-camel-on-click=\"{{ openPrefs }}\">Preferences<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <sc-if value=\"{{ narrow }}\" hint-placeholder-val=\"{{ false }}\">\n          <nav aria-label=\"Contents\" style=\"position:sticky; top:0; z-index:20; display:flex; gap:8px; overflow-x:auto; -webkit-overflow-scrolling:touch; padding:10px 0; margin:0 -4px; background:var(--bg); scrollbar-width:none\">\n            <sc-for list=\"{{ navFlat }}\" as=\"n\" hint-placeholder-count=\"8\">\n              <button type=\"button\" aria-current=\"{{ n.current }}\" style=\"flex:none; font-family:'Fredoka', sans-serif; font-size:15px; font-weight:600; min-height:40px; padding:8px 14px; border-radius:999px; border:0; background:{{ n.bg }}; cursor:pointer; white-space:nowrap; color:{{ n.color }}\" sc-camel-on-click=\"{{ n.go }}\">{{ n.label }}<\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fnav>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ showChips }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display:flex; gap:8px; flex-wrap:wrap; padding:14px 0 4px; font-size:13px; font-weight:700; white-space:nowrap\">\n          <span style=\"padding:6px 12px; border-radius:999px; background:var(--butter); color:var(--butterd)\">📅 {{ dateLine }}<\u002Fspan>\n          <sc-if value=\"{{ hasWeather }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"padding:6px 12px; border-radius:999px; background:var(--sky); color:var(--skyd)\">{{ weatherShort }}<\u002Fspan><\u002Fsc-if>\n          <span style=\"padding:6px 12px; border-radius:999px; background:var(--lilac); color:var(--lilacd)\">🗞️ Edition no. {{ editionNo }}<\u002Fspan>\n        <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fheader>\n\n<sc-if value=\"{{ pageToday }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"display:grid; grid-template-columns:{{ b1Cols }}; gap:20px; align-items:start; margin-top:18px\">\n        <div style=\"min-width:0; display:{{ b1ColDisp }}; gap:20px\">\n          <section style=\"order:1; padding:clamp(22px,2.6vw,30px); border-radius:28px; background:var(--pink)\" aria-label=\"Introduction\">\n            <div style=\"display:flex; justify-content:space-between; align-items:flex-start; gap:14px\">\n              <div style=\"min-width:0\">\n                <span style=\"display:block; font-size:12.5px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; color:var(--pinkd)\">{{ dateLine }}<\u002Fspan>\n                <h1 style=\"font-family:'Fredoka', 'Figtree', sans-serif; font-size:clamp(30px,3.6vw,40px); line-height:1.05; font-weight:600; letter-spacing:-0.02em; margin:6px 0 0\">{{ helloLine }}<\u002Fh1>\n              <\u002Fdiv>\n              <sc-if value=\"{{ hasWeather }}\" hint-placeholder-val=\"{{ false }}\">\n                <div title=\"{{ wx.sub }}\" style=\"flex:none; text-align:center; background:rgba(255,255,255,.7); border-radius:18px; padding:8px 14px\">\n                  <span style=\"display:block; font-size:28px; line-height:1.1\">{{ wx.emoji }}<\u002Fspan>\n                  <span style=\"display:block; font-family:'Fredoka', 'Figtree', sans-serif; font-size:18px; font-weight:600\">{{ wx.temp }}°<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n            <p style=\"font-size:16.5px; line-height:1.6; margin:12px 0 0; max-width:62ch; text-wrap:pretty\">{{ intro }}<\u002Fp>\n            <sc-if value=\"{{ hasWeather }}\" hint-placeholder-val=\"{{ false }}\"><p style=\"font-size:13px; font-weight:600; margin:8px 0 0; color:var(--pinkd)\">{{ wx.line }} · {{ wx.sub }}<\u002Fp><\u002Fsc-if>\n          <\u002Fsection>\n\n          <section style=\"order:4; min-width:0; background:var(--paper); border-radius:28px; padding:20px 22px; box-shadow:0 1px 0 var(--rule), 0 14px 34px -26px rgba(120,40,70,.35)\" aria-label=\"Week at a glance\">\n            <div style=\"display:flex; justify-content:space-between; align-items:baseline; gap:10px; flex-wrap:wrap\">\n              <h2 style=\"font-family:'Fredoka', 'Figtree', sans-serif; font-size:20px; font-weight:600; margin:0\">This week<\u002Fh2>\n              <span style=\"font-size:13px; font-weight:700; color:var(--mute)\">{{ pwTitle }} · tap a day<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"margin-top:12px; overflow-x:auto; -webkit-overflow-scrolling:touch; padding-bottom:4px\">\n            <div style=\"display:grid; grid-template-columns:repeat(7, minmax(0, 1fr)); gap:6px; min-width:560px\">\n            <sc-for list=\"{{ pwDays }}\" as=\"d\" hint-placeholder-count=\"7\">\n              <button type=\"button\" style=\"display:flex; flex-direction:column; gap:5px; text-align:left; min-width:0; min-height:92px; padding:8px 7px; border-radius:14px; border:0; cursor:pointer; background:{{ d.bg }}; box-shadow:{{ d.ring }}; opacity:{{ d.op }}; color:var(--ink); font-family:inherit\" sc-camel-on-click=\"{{ d.go }}\">\n                <span style=\"display:block; width:100%\"><span style=\"display:block; font-size:11px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:var(--mute)\">{{ d.label }}<\u002Fspan><span style=\"display:flex; align-items:baseline; gap:4px\"><span style=\"font-family:'Fredoka', 'Figtree', sans-serif; font-size:19px; font-weight:600; line-height:1.1\">{{ d.date }}<\u002Fspan><sc-if value=\"{{ d.ted }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"font-size:11px\">🩷<\u002Fspan><\u002Fsc-if><\u002Fspan><\u002Fspan>\n                <sc-if value=\"{{ d.empty }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"font-size:13px; color:var(--mute)\">Free ✨<\u002Fspan><\u002Fsc-if>\n                <sc-if value=\"{{ d.showCount }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"display:flex; gap:3px; flex-wrap:wrap\">{{ d.dots }}<\u002Fspan><span style=\"font-size:11.5px; font-weight:700; color:var(--accent); white-space:nowrap\">{{ d.countLabel }}<\u002Fspan><\u002Fsc-if>\n                <sc-for list=\"{{ d.items }}\" as=\"it\" hint-placeholder-count=\"1\">\n                  <span style=\"display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:2; width:100%; font-size:11.5px; line-height:1.25; padding:4px 5px; border-radius:8px; background:var(--soft); box-sizing:border-box; overflow:hidden\"><strong style=\"display:block; font-size:10.5px; white-space:nowrap; color:var(--accent)\">{{ it.t }}<\u002Fstrong>{{ it.text }}<\u002Fspan>\n                <\u002Fsc-for>\n                <sc-if value=\"{{ d.hasMore }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"font-size:12px; font-weight:700; color:var(--accent)\">{{ d.more }}<\u002Fspan><\u002Fsc-if>\n              <\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsection>\n\n          <section style=\"order:5; min-width:0; background:var(--paper); border-radius:28px; padding:24px 26px; box-shadow:0 1px 0 var(--rule), 0 14px 34px -26px rgba(120,40,70,.35)\" aria-label=\"Today\">\n            <div style=\"display:flex; justify-content:space-between; align-items:baseline\">\n              <h2 style=\"font-family:'Fredoka', 'Figtree', sans-serif; font-size:24px; font-weight:600; margin:0\">🗓️ Today<\u002Fh2>\n              <button type=\"button\" style=\"font-size:13px; font-weight:700; padding:0; border:0; background:transparent; color:var(--accent); cursor:pointer\" sc-camel-on-click=\"{{ openSchedule }}\">+ Add<\u002Fbutton>\n            <\u002Fdiv>\n            <sc-if value=\"{{ noEvents }}\" hint-placeholder-val=\"{{ false }}\">\n              <p style=\"font-family:'Fredoka', 'Figtree', sans-serif; font-size:17px; margin:10px 0 0; color:var(--mute)\">Nothing fixed today.<\u002Fp>\n            <\u002Fsc-if>\n            <div style=\"margin-top:6px\">\n              <sc-for list=\"{{ events }}\" as=\"e\" hint-placeholder-count=\"3\">\n                <div style=\"display:grid; grid-template-columns:64px minmax(0,1fr); gap:12px; padding:10px 0; border-bottom:1px solid var(--rule); opacity:{{ e.op }}\">\n                  <span style=\"font-size:14px; font-weight:700; font-variant-numeric:tabular-nums; padding-top:2px\">{{ e.timeLabel }}<\u002Fspan>\n                  <div style=\"min-width:0\">\n         <span style=\"display:block; font-size:11.5px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; color:var(--accent)\">{{ c.trade }}<\u002Fspan>\n                        <span style=\"display:block; font-size:16.5px; font-weight:700; line-height:1.3; margin-top:2px\">{{ c.company }}<\u002Fspan>\n                        <sc-if value=\"{{ c.hasPerson }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"display:block; font-size:14px; color:var(--mute)\">{{ c.person }}<\u002Fspan><\u002Fsc-if>\n                      <\u002Fdiv>\n                    <\u002Fdiv>\n                    <div style=\"display:flex; gap:8px; align-items:center; justify-content:space-between; margin-top:14px\">\n                      <sc-if value=\"{{ c.hasPhone }}\" hint-placeholder-val=\"{{ false }}\"><a href=\"{{ c.tel }}\" style=\"font-size:15px; font-weight:800; padding:9px 16px; border-radius:999px; background:var(--accent); color:#fff; text-decoration:none; white-space:nowrap\">📞 {{ c.phone }}<\u002Fa><\u002Fsc-if>\n                      <button type=\"button\" style=\"font-size:12.5px; font-weight:700; padding:0; border:0; background:transparent; color:var(--mute); cursor:pointer\" sc-camel-on-click=\"{{ c.edit }}\">Edit<\u002Fbutton>\n                    <\u002Fdiv>\n                  <\u002Fsc-if>\n                  <sc-if value=\"{{ c.editing }}\" hint-placeholder-val=\"{{ false }}\">\n                    <div style=\"display:grid; gap:8px\">\n                      <input style=\"min-width:0; font-size:14.5px; padding:8px 10px; border-radius:10px; border:0; background:var(--soft); color:var(--ink); outline:none\" placeholder=\"Trade, e.g. Plumber\" value=\"{{ c.trade }}\" sc-camel-on-change=\"{{ c.setTrade }}\">\n                      <input style=\"min-width:0; font-size:14.5px; padding:8px 10px; border-radius:10px; border:0; background:var(--soft); color:var(--ink); outline:none\" placeholder=\"Company\" value=\"{{ c.company }}\" sc-camel-on-change=\"{{ c.setCompany }}\">\n                      <input style=\"min-width:0; font-size:14.5px; padding:8px 10px; border-radius:10px; border:0; background:var(--soft); color:var(--ink); outline:none\" placeholder=\"Contact person\" value=\"{{ c.person }}\" sc-camel-on-change=\"{{ c.setPerson }}\">\n                      <input style=\"min-width:0; font-size:14.5px; padding:8px 10px; border-radius:10px; border:0; background:var(--soft); color:var(--ink); outline:none\" inputmode=\"tel\" placeholder=\"Phone\" value=\"{{ c.phone }}\" sc-camel-on-change=\"{{ c.setPhone }}\">\n                      <div style=\"display:flex; justify-content:space-between; align-items:center\">\n                        <button type=\"button\" style=\"font-size:13px; font-weight:700; padding:7px 14px; border-radius:999px; border:0; background:var(--accent); color:#fff; cursor:pointer\" sc-camel-on-click=\"{{ c.edit }}\">Done<\u002Fbutton>\n                        <button type=\"button\" style=\"font-size:12.5px; font-weight:700; padding:0; border:0; background:transparent; color:var(--mute); cursor:pointer\" sc-camel-on-click=\"{{ c.remove }}\">Remove<\u002Fbutton>\n                      <\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fsc-if>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ hTabBills }}\" hint-placeholder-val=\"{{ false }}\">\n      <section style=\"padding-top:18px; max-width:900px\">\n        <h2 style=\"font-family:'Fredoka', 'Figtree', sans-serif; font-size:clamp(30px,4vw,44px); line-height:1; font-weight:600; letter-spacing:-0.02em; margin:0\">💸 Bills<\u002Fh2>\n        <p style=\"font-family:'Fredoka', 'Figtree', sans-serif; font-size:19px; line-height:1.5; margin:14px 0 0; color:var(--mute)\">{{ billSummary }}<\u002Fp>\n        <sc-if value=\"{{ billSample }}\" hint-placeholder-val=\"{{ false }}\">\n          <p style=\"font-size:14px; font-weight:600; line-height:1.5; margin:14px 0 0; padding:10px 16px; border-radius:16px; background:var(--butter); color:var(--butterd); display:inline-block\">🌼 These are sample bills. Remove them and add your own.<\u002Fp>\n        <\u002Fsc-if>\n        <div style=\"display:flex; gap:10px 14px; flex-wrap:wrap; align-items:flex-end; margin-top:24px; padding:20px; border-radius:28px; background:var(--peach)\">\n          <input style=\"flex:2 1 180px; min-width:0; font-size:16px; padding:8px 0; border:0; border-bottom:2px solid rgba(156,78,28,.25); background:transparent; color:var(--ink); outline:none\" placeholder=\"Bill, e.g. Electricity\" value=\"{{ bName }}\" sc-camel-on-change=\"{{ setBName }}\" sc-camel-on-key-down=\"{{ billKey }}\">\n          <input inputmode=\"decimal\" style=\"flex:1 1 90px; min-width:0; font-size:16px; padding:8px 0; border:0; border-bottom:2px solid rgba(156,78,28,.25); background:transparent; color:var(--ink); outline:none\" placeholder=\"Amount\" value=\"{{ bAmt }}\" sc-camel-on-change=\"{{ setBAmt }}\" sc-camel-on-key-down=\"{{ billKey }}\">\n          <label style=\"display:grid; gap:4px; font-size:12px; font-weight:700; color:var(--peachd)\">Due<input type=\"date\" style=\"font-size:14px; padding:7px 8px; border-radius:12px; border:0; background:#fff; color:var(--ink)\" value=\"{{ bDue }}\" sc-camel-on-change=\"{{ setBDue }}\"><\u002Flabel>\n          <div style=\"display:flex; gap:4px; flex-wrap:wrap\">\n            <sc-for list=\"{{ billRepeatOpts }}\" as=\"o\" hint-placeholder-count=\"6\">\n              <button type=\"button\" style=\"font-size:12.5px; font-weight:700; padding:6px 10px; border-radius:999px; border:0; cursor:pointer; background:{{ o.bg }}; color:{{ o.color }}\" sc-camel-on-click=\"{{ o.pick }}\">{{ o.label }}<\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <button type=\"button\" style=\"flex:none; font-size:14px; font-weight:700; padding:9px 18px; border-radius:999px; border:0; background:var(--accent); color:#fff; cursor:pointer\" sc-camel-on-click=\"{{ addBill }}\">Add bill<\u002Fbutton>\n        <\u002Fdiv>\n        <sc-if value=\"{{ noBills }}\" hint-placeholder-val=\"{{ false }}\">\n          <p style=\"font-family:'Fredoka', 'Figtree', sans-serif; font-size:20px; margin:28px 0 0\">All paid up 🎉<\u002Fp>\n        <\u002Fsc-if>\n        <sc-for list=\"{{ billGroups }}\" as=\"g\" hint-placeholder-count=\"2\">\n          <div style=\"margin-top:28px\">\n            <h2 style=\"font-family:'Fredoka', 'Figtree', sans-serif; font-size:22px; font-weight:600; margin:0\">{{ g.title }}<\u002Fh2>\n            <div style=\"display:grid; gap:8px; margin-top:10px\">\n              <sc-for list=\"{{ g.items }}\" as=\"b\" hint-placeholder-count=\"2\">\n                <div style=\"display:flex; gap:14px; align-items:center; flex-wrap:wrap; background:{{ b.bg }}; border-radius:20px; padding:14px 18px; box-shadow:0 1px 0 var(--rule)\">\n                  <span style=\"flex:none; font-size:26px\">💸<\u002Fspan>\n                  <div style=\"flex:1 1 180px; min-width:0\">\n                    <span style=\"display:block; font-size:17px; font-weight:700\">{{ b.name }}<\u002Fspan>\n                    <span style=\"display:block; font-size:13px; font-weight:700; color:{{ b.whenColor }}\">{{ b.when }}<\u002Fspan>\n                    <span style=\"display:block; font-size:13px; color:var(--mute)\">{{ b.dateLabel }} · {{ b.repeatLabel }}<\u002Fspan>\n                  <\u002Fdiv>\n                  <span style=\"flex:none; font-family:'Fredoka', 'Figtree', sans-serif; font-size:22px; font-weight:600\">{{ b.amountLabel }}<\u002Fspan>\n                  <div style=\"flex:none; display:flex; gap:10px; align-items:center\">\n                    <button type=\"button\" style=\"font-size:13px; font-weight:700; padding:8px 14px; border-radius:999px; border:0; background:var(--accent); color:#fff; cursor:pointer; white-space:nowrap\" sc-camel-on-click=\"{{ b.pay }}\">Mark paid ✓<\u002Fbutton>\n                    <button type=\"button\" style=\"font-size:12px; font-weight:700; padding:0; border:0; background:transparent; color:var(--mute); cursor:pointer\" sc-camel-on-click=\"{{ b.remove }}\">Remove<\u002Fbutton>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n        <sc-if value=\"{{ hasPaid }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"margin-top:36px\">\n            <h2 style=\"font-family:'Fredoka', 'Figtree', sans-serif; font-size:22px; font-weight:600; margin:0\">✅ Paid<\u002Fh2>\n            <div style=\"margin-top:10px; background:var(--mint); border-radius:24px; padding:6px 18px\">\n              <sc-for list=\"{{ paidList }}\" as=\"p\" hint-placeholder-count=\"2\">\n                <div style=\"display:flex; gap:12px; align-items:baseline; padding:10px 0; border-bottom:1px solid rgba(37,107,76,.15)\">\n                  <span style=\"flex:1; min-width:0; font-size:15.5px; font-weight:600\">{{ p.name }}<\u002Fspan>\n                  <span style=\"font-size:13px; color:var(--mintd)\">{{ p.sub }}<\u002Fspan>\n                  <span style=\"font-size:15px; font-weight:700\">{{ p.amountLabel }}<\u002Fspan>\n                  <button type=\"button\" style=\"font-size:12px; font-weight:700; padding:0; border:0; background:transparent; color:var(--mute); cursor:pointer\" sc-camel-on-click=\"{{ p.undo }}\">Undo<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fsection>\n<\u002Fsc-if>\n      <\u002Fsection>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ pageDump }}\" hint-placeholder-val=\"{{ false }}\">\n      <section style=\"padding:clamp(28px,4vw,48px) 0 0; max-width:820px\">\n        <span style=\"font-size:11.5px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--mute)\">The evening edition<\u002Fspan>\n        <h1 style=\"font-family:'Fredoka', 'Figtree', sans-serif; font-size:clamp(40px,6vw,72px); line-height:1; font-weight:600; letter-spacing:-0.02em; margin:10px 0 0\">🌙 Tell me about your day.<\u002Fh1>\n        <sc-if value=\"{{ prHas }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"margin-top:22px; background:var(--pink); border-radius:28px; padding:22px\">\n            <h2 style=\"font-family:'Fredoka', 'Figtree', sans-serif; font-size:24px; font-weight:600; margin:0; color:var(--pinkd)\">🅿️ Your parked thoughts<\u002Fh2>\n            <p style=\"font-size:15px; line-height:1.5; margin:6px 0 0; color:var(--pinkd)\">Decide what happens to each one before you close the day.<\u002Fp>\n            <div style=\"display:grid; gap:8px; margin-top:14px\">\n              <sc-for list=\"{{ prItems }}\" as=\"p\" hint-placeholder-count=\"2\">\n                <div style=\"background:#fff; border-radius:18px; padding:12px 14px\">\n                  <span style=\"display:block; font-size:16px; font-weight:700; line-height:1.35\">{{ p.text }}<\u002Fspan>\n                  <span style=\"display:block; font-size:12.5px; color:var(--mute)\">{{ p.when }}<\u002Fspan>\n                  <div style=\"display:flex; gap:6px; flex-wrap:wrap; margin-top:10px\">\n                    <sc-for list=\"{{ p.acts }}\" as=\"a\" hint-placeholder-count=\"5\">\n                      <button type=\"button\" style=\"font-size:13px; font-weight:700; padding:7px 12px; border-radius:999px; border:0; cursor:pointer; white-space:nowrap; background:{{ a.bg }}; color:{{ a.color }}\" sc-camel-on-click=\"{{ a.go }}\">{{ a.label }}<\u002Fbutton>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <p style=\"font-family:'Fredoka', 'Figtree', sans-serif; font-size:19px; line-height:1.55; margin:14px 0 0; color:var(--mute)\">Type or dictate anything: what happened, plans you made, things to do, people you spoke to, food that needs using, ideas. I’ll suggest where each piece goes. Nothing is filed until you confirm.<\u002Fp>\n        <div style=\"display:flex; flex-wrap:wrap; gap:8px 14px; align-items:center; margin-top:22px; padding:14px 18px; border-radius:20px; background:var(--lilac)\">\n          <span style=\"font-size:15px; font-weight:700; color:var(--lilacd); white-space:nowrap\">💬 What did bb say?<\u002Fspan>\n          <span style=\"flex:1 1 220px; font-size:13.5px; line-height:1.45; color:var(--lilacd)\">Paste bb’s tidy list below and each line gets filed in the right place.<\u002Fspan>\n          <button type=\"button\" style=\"flex:none; white-space:nowrap; font-size:13px; font-weight:700; padding:8px 14px; border-radius:999px; border:0; background:var(--lilacd); color:#fff; cursor:pointer\" sc-camel-on-click=\"{{ copyBB }}\">{{ copyBBLabel }}<\u002Fbutton>\n        <\u002Fdiv>\n        <textarea rows=\"7\" style=\"width:100%; box-sizing:border-box; margin-top:12px; font-family:'Fredoka', 'Figtree', sans-serif; font-size:19px; line-height:1.6; padding:16px 18px; border:1px solid var(--rule); border-radius:12px; background:var(--paper); color:var(--ink); outline:none; resize:vertical\" placeholder=\"Dinner at Jess’s next Friday at 7. Rego is due on the 12th. Staff meeting moved to Tuesday 8am. The spinach needs using. I’d like to read more about ADHD and kids.\" value=\"{{ dumpText }}\" sc-camel-on-change=\"{{ setDumpText }}\"><\u002Ftextarea>\n        <div style=\"display:flex; gap:10px 18px; align-items:center; flex-wrap:wrap; margin-top:12px\">\n          <button type=\"button\" style=\"font-size:14px; font-weight:700; padding:9px 18px; border-radius:999px; border:0; background:var(--accent); color:#fff; cursor:pointer\" sc-camel-on-click=\"{{ sortDump }}\">{{ sortLabel }}<\u002Fbutton>\n          <sc-if value=\"{{ canDictate }}\" hint-placeholder-val=\"{{ false }}\">\n            <button type=\"button\" style=\"flex:none; white-space:nowrap; font-size:13px; font-weight:700; padding:0; border:0; background:transparent; color:var(--accent); cursor:pointer\" sc-camel-on-click=\"{{ dictate }}\">{{ dictateLabel }}<\u002Fbutton>\n          <\u002Fsc-if>\n          <span style=\"font-size:13px; color:var(--mute)\">{{ sortHint }}<\u002Fspan>\n          <sc-if value=\"{{ hasMicMsg }}\" hint-placeholder-val=\"{{ false }}\">\n            <span style=\"flex-basis:100%; font-size:13.5px; font-weight:600; line-height:1.45; padding:10px 14px; border-radius:14px; background:var(--peach); color:var(--peachd)\">🎙️ {{ micMsg }}<\u002Fspan>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n\n        <sc-if value=\"{{ hasDumpItems }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex; align-items:baseline; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-top:40px; background:var(--paper); border-radius:28px; padding:24px; box-shadow:0 1px 0 var(--rule), 0 14px 34px -26px rgba(120,40,70,.35)\">\n            <h2 style=\"font-family:'Fredoka', 'Figtree', sans-serif; font-size:28px; font-weight:600; margin:0\">Here’s what I heard<\u002Fh2>\n            <button type=\"button\" style=\"font-size:14px; font-weight:700; padding:9px 18px; border-radius:999px; border:0; background:var(--accent); color:#fff; cursor:pointer\" sc-camel-on-click=\"{{ fileDump }}\">{{ fileLabel }}<\u002Fbutton>\n          <\u002Fdiv>\n          <p style=\"font-size:14px; margin:6px 0 0; color:var(--mute)\">Untick anything you don’t want. Items marked “check this” were unclear, so they start unticked.<\u002Fp>\n          <div style=\"margin-top:8px\">\n            <sc-for list=\"{{ dumpItems }}\" as=\"it\" hint-placeholder-count=\"3\">\n              <div style=\"display:grid; gap:10px; padding:16px 0; border-bottom:1px solid var(--rule); opacity:{{ it.op }}\">\n                <div style=\"display:flex; gap:12px; align-items:center\">\n                  <button type=\"button\" aria-label=\"Include\" style=\"flex:none; width:22px; height:22px; border-radius:12px; border:1.5px solid var(--ink); background:{{ it.checkBg }}; color:var(--paper); cursor:pointer; font-size:12px; font-weight:800; padding:0\" sc-camel-on-click=\"{{ it.toggle }}\">{{ it.mark }}<\u002Fbutton>\n                  <input style=\"flex:1; min-width:0; font-family:'Fredoka', 'Figtree', sans-serif; font-size:19px; padding:4px 0; border:0; border-bottom:1px solid var(--rule); background:transparent; color:var(--ink); outline:none\" value=\"{{ it.text }}\" sc-camel-on-change=\"{{ it.setText }}\">\n                <\u002Fdiv>\n                <sc-if value=\"{{ it.hasExtra }}\" hint-placeholder-val=\"{{ false }}\">\n                  <span style=\"font-size:14px; font-weight:700; color:var(--peachd); padding-left:34px\">{{ it.extra }}<\u002Fspan>\n                <\u002Fsc-if>\n                <sc-if value=\"{{ it.unsure }}\" hint-placeholder-val=\"{{ false }}\">\n                  <span style=\"font-family:'Fredoka', 'Figtree', sans-serif; font-size:15px; color:var(--accent); padding-left:34px\">Check this: {{ it.why }}<\u002Fspan>\n                <\u002Fsc-if>\n                <div style=\"display:flex; gap:4px; flex-wrap:wrap; padding-left:34px\">\n                  <sc-for list=\"{{ it.kinds }}\" as=\"k\" hint-placeholder-count=\"7\">\n                    <button type=\"button\" style=\"font-size:12.5px; font-weight:700; padding:5px 10px; border-radius:999px; border:0; cursor:pointer; background:{{ k.bg }}; color:{{ k.color }}\" sc-camel-on-click=\"{{ k.pick }}\">{{ k.label }}<\u002Fbutton>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n                <div style=\"display:flex; gap:8px 14px; flex-wrap:wrap; align-items:center; padding-left:34px\">\n                  <sc-if value=\"{{ it.needsDate }}\" hint-placeholder-val=\"{{ false }}\">\n                    <input type=\"date\" aria-label=\"Date\" style=\"fo           <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"display:flex; gap:10px; align-items:flex-end; margin-top:12px\">\n          <input style=\"flex:1; min-width:0; font-size:15px; padding:10px 0; border:0; border-bottom:2px solid var(--rule); background:transparent; color:#221B35; outline:none; border-bottom-color:rgba(34,27,53,.25)\" placeholder=\"Add a work to-do\" value=\"{{ wTodo }}\" sc-camel-on-change=\"{{ setWTodo }}\" sc-camel-on-key-down=\"{{ wTodoKey }}\">\n          <button type=\"button\" style=\"flex:none; font-size:13px; font-weight:700; padding:7px 14px; border-radius:999px; border:0; background:#221B35; color:#C6F432; cursor:pointer\" sc-camel-on-click=\"{{ wTodoAdd }}\">Add<\u002Fbutton>\n        <\u002Fdiv>\n      \n            <div style=\"margin-top:16px; background:#fff; border-radius:18px; padding:14px\">\n              <div style=\"display:flex; justify-content:space-between; align-items:baseline; gap:8px\"><span style=\"font-family:'Fredoka', 'Figtree', sans-serif; font-size:17px; font-weight:600\">🏃 People to catch<\u002Fspan><span style=\"font-size:12.5px; font-weight:800; color:#B0246A\">{{ pcCount }}<\u002Fspan><\u002Fdiv>\n              <div style=\"display:grid; gap:6px; margin-top:8px\">\n                <sc-for list=\"{{ pcItems }}\" as=\"p\" hint-placeholder-count=\"2\">\n                  <div style=\"display:flex; gap:8px; align-items:center; padding:7px 10px; border-radius:12px; background:#FFE3F1; opacity:{{ p.op }}\">\n                    <button type=\"button\" aria-label=\"Caught them\" style=\"flex:none; width:20px; height:20px; box-sizing:border-box; border-radius:6px; border:2px solid #B0246A; background:{{ p.fill }}; color:#fff; cursor:pointer; padding:0; font-size:11px; font-weight:900\" sc-camel-on-click=\"{{ p.toggle }}\">{{ p.mark }}<\u002Fbutton>\n                    <span style=\"flex:1; min-width:0; font-size:14px; line-height:1.35; text-decoration:{{ p.deco }}\"><strong>{{ p.w A double (45 min) doesn’t fit here. Pick an earlier time if you need longer.<\u002Fspan><\u002Fsc-if>\n                  <div style=\"display:flex; gap:6px; flex-wrap:wrap\"><sc-for list=\"{{ ttLenOpts }}\" as=\"o\" hint-placeholder-count=\"2\"><button type=\"button\" style=\"font-size:13.5px; font-weight:800; padding:9px 13px; border-radius:999px; border:0; cursor:pointer; background:{{ o.bg }}; color:{{ o.color }}\" sc-camel-on-click=\"{{ o.pick }}\">{{ o.label }}<\u002Fbutton><\u002Fsc-for><\u002Fdiv>\n                  <button type=\"button\" style=\"font-size:15px; font-weight:800; padding:11px 20px; border-radius:999px; border:0; background:#221B35; color:#C6F432; cursor:pointer; opacity:{{ ttBookOp }}\" sc-camel-on-click=\"{{ ttBook }}\">Book it 💬<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ ttPickBooked }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-top:12px\">\n                  <span style=\"flex:1 1 200px; font-size:17px; font-weight:800; color:#221B35\">💬 {{ ttPickName }}<\u002Fspan>\n                  <button type=\"button\" style=\"font-size:14px; font-weight:800; padding:9px 16px; border-radius:999px; border:0; background:#FF7AB6; color:#221B35; cursor:pointer\" sc-camel-on-click=\"{{ ttOpenNotes }}\">Open notes<\u002Fbutton>\n                  <button type=\"button\" style=\"font-size:14px; font-weight:800; padding:9px 16px; border-radius:999px; border:0; background:#F2EEFA; color:#221B35; cursor:pointer\" sc-camel-on-click=\"{{ ttCancel }}\">Cancel booking<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <div style=\"display:flex; gap:6px 12px; flex-wrap:wrap; margin-top:12px; font-size:12px; font-weight:800; color:#221B35\">\n            <span style=\"display:inline-flex; gap:6px; align-items:center\"><span style=\"width:12px; height:12px; border-radius:4px; background:#F1FFD6; box-shadow:inset 0 0 0 2px #8DBA1E\"><\u002Fspan>Free, tap to book<\u002Fspan>\n            <span style=\"display:inline-flex; gap:6px; align-items:center\"><span style=\"width:12px; height:12px; border-radius:4px; background:#fff; box-shadow:0 0 0 1px rgba(34,27,53,.2)\"><\u002Fspan>On site, free<\u002Fspan>\n            <span style=\"display:inline-flex; gap:6px; align-items:center\"><span style=\"width:12px; height:12px; border-radius:4px; background:#FF7AB6\"><\u002Fspan>Booked<\u002Fspan>\n            <span style=\"display:inline-flex; gap:6px; align-items:center\"><span style=\"width:12px; height:12px; border-radius:4px; background:#221B35\"><\u002Fspan>Meeting<\u002Fspan>\n            <span style=\"display:inline-flex; gap:6px; align-items:center\"><span style=\"width:12px; height:12px; border-radius:4px; background:#5CE1E6\"><\u002Fspan>Recess &amp; lunch<\u002Fspan>\n            <span style=\"display:inline-flex; gap:6px; align-items:center\"><span style=\"width:12px; height:12px; border-radius:4px; background:#FFE08A\"><\u002Fspan>Admin<\u002Fspan>\n            <span style=\"display:inline-flex; gap:6px; align-items:center\"><span style=\"width:12px; height:12px; border-radius:4px; background:#C9B8FF\"><\u002Fspan>Other<\u002Fspan>\n            <sc-if value=\"{{ sTeacher }}\" hint-placeholder-val=\"{{ true }}\"><span style=\"font-weight:600; color:#6B5E86\">Tap FREE to book a student in, BOOKED to see notes, or admin to jot what you did.<\u002Fspan><\u002Fsc-if>\n          <\u002Fdiv>\n          <sc-if value=\"{{ ttAdminOpen }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"margin-top:12px; background:#FFF3C4; border-radius:18px; padding:14px\">\n              <div style=\"display:flex; justify-content:space-between; gap:10px; align-items:center\">\n                <span style=\"font-size:14px; font-weight:800; color:#221B35\">🗂️ {{ ttAdminTitle }}<\u002Fspan>\n                <button type=\"button\" style=\"font-size:13px; font-weight:700; padding:0; border:0; background:transparent; color:#6B5E86; cursor:pointer\" sc-camel-on-click=\"{{ ttAdminClose }}\">Done<\u002Fbutton>\n              <\u002Fdiv>\n              <textarea rows=\"3\" style=\"width:100%; box-sizing:border-box; margin-top:8px; font-family:inherit; font-size:15px; line-height:1.5; padding:10px 12px; border-radius:12px; border:0; background:#fff; color:#221B35; resize:vertical; outline:none\" placeholder=\"What I worked on…\" value=\"{{ ttAdminNote }}\" sc-camel-on-change=\"{{ setTtAdminNote }}\"><\u002Ftextarea>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ sEditing }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display:grid; gap:10px; margin-top:14px; padding:14px; border-radius:20px; border:2px dashed rgba(34,27,53,.3)\">\n              <span style=\"font-size:12px; font-weight:800; letter-spacing:.1em; text-transform:uppercase; color:#6B5E86\">✏️ Break times<\u002Fspan>\n              <label style=\"display:flex; gap:8px; align-items:center; flex-wrap:wrap; font-size:13px; font-weight:700; color:#221B35\">🍎 Recess<input style=\"font-size:15px; padding:9px 12px; border-radius:12px; border:0; background:#fff; color:#221B35; outline:none; min-width:0; width:170px\" placeholder=\"e.g. 10:40–11:00\" value=\"{{ sRecessRaw }}\" sc-camel-on-change=\"{{ setSRecess }}\"><\u002Flabel>\n              <sc-for list=\"{{ sBreaks }}\" as=\"b\" hint-placeholder-count=\"5\">\n                <div style=\"display:flex; gap:6px; align-items:center; flex-wrap:wrap\">\n                  <span style=\"width:92px; font-size:13px; font-weight:800; color:#221B35\">{{ b.label }}<\u002Fspan>\n                  <sc-for list=\"{{ b.opts }}\" as=\"o\" hint-placeholder-count=\"2\">\n                    <button type=\"button\" style=\"font-size:12px; font-weight:800; padding:6px 10px; border-radius:999px; border:0; cursor:pointer; background:{{ ; white-space:nowrap; color:{{ r.gapColor }}\">{{ r.gap }}<\u002Fspan><\u002Fsc-if>\n                  <sc-if value=\"{{ r.filled }}\" hint-placeholder-val=\"{{ false }}\"><button type=\"button\" style=\"font-size:12px; font-weight:700; padding:0; border:0; background:transparent; color:#6B5E86; cursor:pointer\" sc-camel-on-click=\"{{ r.clear }}\">Clear<\u002Fbutton><\u002Fsc-if>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <button type=\"button\" style=\"margin-top:10px; font-size:14px; font-weight:800; padding:10px 16px; border-radius:999px; border:2px dashed rgba(14,124,131,.45); background:transparent; color:#0E7C83; cursor:pointer\" sc-camel-on-click=\"{{ atAdd }}\">➕ Add another student<\u002Fbutton>\n          <sc-if value=\"{{ sNoQuiz }}\" hint-placeholder-val=\"{{ false }}\"><p style=\"font-size:15px; font-weight:700; margin:14px 0 0; color:#0E7C83\">No quizzes yet.<\u002Fp><\u002Fsc-if>\n          <div style=\"display:grid; gap:10px; margin-top:14px\">\n            <sc-for list=\"{{ sQuizzes }}\" as=\"q\" hint-placeholder-count=\"2\">\n              <div style=\"display:flex; gap:12px; align-items:center; flex-wrap:wrap; background:#fff; border-radius:20px; padding:14px 18px\">\n                <span style=\"font-size:24px\">📝<\u002Fspan>\n                <div style=\"flex:1 1 200px; min-width:0\"><span style=\"display:block; font-size:17px; font-weight:800; color:#221B35\">{{ q.title }}<\u002Fspan><span style=\"display:block; font-size:13px; font-weight:700; color:{{ q.dueColor }}\">{{ q.due }}<\u002Fspan><\u002Fdiv>\n                <sc-if value=\"{{ q.hasUrl }}\" hint-placeholder-val=\"{{ false }}\"><a href=\"{{ q.url }}\" target=\"_blank\" rel=\"noopener noreferrer\" style=\"flex:none; font-size:14px; font-weight:800; padding:10px 18px; border-radius:999px; background:#221B35; color:#5CE1E6; text-decoration:none; white-space:nowrap\">Open quiz ↗<\u002Fa><\u002Fsc-if>\n                <sc-if value=\"{{ sEditing }}\" hint-placeholder-val=\"{{ false }}\"><button type=\"button\" aria-label=\"Remove\" style=\"flex:none; border:0; background:transparent; cursor:pointer; color:#6B5E86; font-size:15px\" sc-camel-on-click=\"{{ q.remove }}\">×<\u002Fbutton><\u002Fsc-if>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <sc-if value=\"{{ sEditing }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:14px; padding:14px; border-radius:20px; border:2px dashed rgba(34,27,53,.25)\">\n              <span style=\"flex-basis:100%; font-size:12px; font-weight:800; letter-spacing:.1em; text-transform:uppercase; color:#6B5E86\">✏️ Add a quiz<\u002Fspan>\n              <input style=\"font-size:15px; padding:9px 12px; border-radius:12px; border:0; background:#fff; color:#221B35; outline:none; min-width:0; flex:1 1 200px\" placeholder=\"Quiz name, e.g. Week 4 check-in\" value=\"{{ sQTitle }}\" sc-camel-on-change=\"{{ setSQTitle }}\">\n              <input type=\"date\" aria-label=\"Due\" style=\"font-size:15px; padding:9px 12px; border-radius:12px; border:0; background:#fff; color:#221B35; outline:none; min-width:0\" value=\"{{ sQDue }}\" sc-camel-on-change=\"{{ setSQDue }}\">\n              <input style=\"font-size:15px; padding:9px 12px; border-radius:12px; border:0; background:#fff; color:#221B35; outline:none; min-width:0; flex:1 1 200px\" placeholder=\"Link to the quiz\" value=\"{{ sQUrl }}\" sc-camel-on-change=\"{{ setSQUrl }}\" sc-camel-on-key-down=\"{{ sQKey }}\">\n              <button type=\"button\" style=\"flex:none; font-size:14px; font-weight:800; padding:9px 16px; border-radius:999px; border:0; background:#221B35; color:#C6F432; cursor:pointer\" sc-camel-on-click=\"{{ sQAdd }}\">Add quiz<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ sTabEod }}\" hint-placeholder-val=\"{{ false }}\">\n        <section style=\"margin-top:18px; background:#FFE3F1; border-radius:30px; padding:clamp(22px,3vw,32px)\" aria-label=\"End of the work day\">\n      <span style=\"font-size:11.5px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:#B0246A\">🌇 End of the work day<\u002Fspan>\n      <h2 style=\"font-family:'Fredoka', 'Figtree', sans-serif; font-size:clamp(26px,3vw,34px); line-height:1.1; font-weight:600; margin:10px 0 0\">How did work go?<\u002Fh2>\n      <p style=\"font-size:16px; line-height:1.55; margin:8px 0 0; color:#6B5E86\">Talk or type it out: who you saw, what’s unfinished, what to remember tomorrow.<\u002Fp>\n      <textarea rows=\"5\" style=\"width:100%; box-sizing:border-box; margin-top:14px; font-family:inherit; font-size:17px; line-height:1.6; padding:14px 16px; border:0; border-radius:16px; background:#fff; color:#221B35; outline:none; resize:vertical\" placeholder=\"Saw two students at lunch. Need to email the year adviser about Friday. Finish the excursion permission notes…\" value=\"{{ wDump }}\" sc-camel-on-change=\"{{ setWDump }}\"><\u002Ftextarea>\n      <div style=\"display:flex; gap:10px 16px; flex-wrap:wrap; align-items:center; margin-top:12px\">\n        <button type=\"button\" style=\"font-size:14px; font-weight:700; padding:9px 18px; border-radius:999px; border:0; background:#221B35; color:#FF7AB6; cursor:pointer\" sc-camel-on-click=\"{{ wRead }}\">Read it back to me<\u002Fbutton>\n        <button type=\"button\" style=\"flex:none; white-space:nowrap; font-size:13px; font-weight:700; padding:0; border:0; background:transparent; color:#B0246A; cursor:pointer\" sc-camel-on-click=\"{{ wDictate }}\">{{ wDictateLabel }}<\u002Fbutton>\n        <sc-if value=\"{{ hasMicMsg }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"flex-basis:100%; font-size:13.5px; font-weight:600; padding:10px 14px; border-radius:14px; background:#fff; color:#B0246A\">🎙️ {{ micMsg }}<\u002Fspan><\u002Fsc-if>\n        <sc-if value=\"{{ wHasMsg }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"flex-basis:100%; font-size:14px; font-weight:700; color:#B0246A\">{{ wMsg }}<\u002Fspan><\u002Fsc-if>\n      <\u002Fdiv>\n      <sc-if value=\"{{ wHasItems }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display:grid; gap:8px; margin-top:16px\">\n          <sc-for list=\"{{ wItems }}\" as=\"it\" hint-placeholder-count=\"2\">\n            <div style=\"background:#fff; border-radius:16px; padding:12px 14px\">\n              <span style=\"display:block; font-size:15.5px; font-weight:600; line-height:1.4\">{{ it.text }}<\u002Fspan>\n              <div style=\"display:flex; gap:6px; flex-wrap:wrap; margin-top:8px\">\n                <sc-for list=\"{{ it.opts }}\" as=\"o\" hint-placeholder-count=\"4\">\n                  <button type=\"button\" style=\"font-size:12.5px; font-weight:700; padding:6px 11px; border-radius:999px; border:0; cursor:pointer; background:{{ o.bg }}; color:{{ o.color }}\" sc-camel-on-click=\"{{ o.pick }}\">{{ o.label }}<\u002Fbutton>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <button type=\"button\" style=\"margin-top:14px; font-size:15px; font-weight:800; padding:11px 22px; border-radius:999px; border:0; background:#221B35; color:#FF7AB6; cursor:pointer\" sc-camel-on-click=\"{{ wFile }}\">File it<\u002Fbutton>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ wHasLog }}\" hint-placeholder-val=\"{{ false }}\">\n        <h3 style=\"font-family:'Fredoka', 'Figtree', sans-serif; font-size:19px; font-weight:600; margin:24px 0 0\">Recent work days<\u002Fh3>\n        <div style=\"display:grid; gap:8px; margin-top:10px\">\n          <sc-for list=\"{{ wLog }}\" as=\"l\" hint-placeholder-count=\"2\">\n            <div style=\"background:rgba(255,255,255,.65); border-radius:16px; padding:12px 14px\">\n              <span style=\"display:block; font-size:12.5px; font-weight:800; color:#B0246A\">{{ l.date }}<\u002Fspan>\n              <span style=\"display:block; font-size:15px; line-height:1.5; margin-top:2px\">{{ l.text }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fsection>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ sTeacher }}\" hint-placeholder-val=\"{{ true }}\">\n        <p style=\"font-size:12.5px; line-height:1.5; margin:16px 0 0; color:var(--mute)\">Student view shows the banner, Fun Days and the week, with chats as FREE or BOOKED with first names.<\u002Fp>\n      <\u002Fsc-if>\n    <\u002Fsection>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ pageTed }}\" hint-placeholder-val=\"{{ false }}\">\n      <section style=\"padding:clamp(24px,4vw,44px) 0 0\">\n        <div style=\"background:#C9F4F1; border-radius:32px; padding:clamp(22px,3vw,34px); display:flex; flex-wrap:wrap; gap:16px 28px; align-items:center; justify-content:space-between\">\n          <div>\n            <h1 style=\"font-family:'Fredoka', 'Figtree', sans-serif; font-size:clamp(36px,5vw,58px); line-height:1; font-weight:600; letter-spacing:-0.02em; margin:0; color:#5B3FA8\">🧸 Hi Ted!<\u002Fh1>\n            <p style=\"font-family:'Fredoka', 'Figtree', sans-serif; font-size:clamp(17px,1.8vw,21px); font-weight:600; margin:10px 0 0; color:#14786F\">{{ tedHeadline }}<\u002Fp>\n            <p style=\"font-size:16px; line-height:1.6; margin:10px 0 0; max-width:62ch; color:#0F5E57\">{{ tedBlurb }}<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"display:flex; gap:8px; flex-wrap:wrap\">\n            <span style=\"font-size:13px; font-weight:700; padding:8px 14px; border-radius:999px; background:#fff; color:#14786F\">💙 {{ tedNextLabel }}<\u002Fspan>\n            <span style=\"font-size:13px; font-weight:700; padding:8px 14px; border-radius:999px; background:#EDE3FF; color:#5B3FA8\">🎒 {{ termShort }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:flex; gap:6px; flex-wrap:wrap; margin-top:18px\">\n          <sc-for list=\"{{ tedTabs }}\" as=\"t\" hint-placeholder-count=\"4\">\n            <button type=\"button\" style=\"font-size:14px; font-weight:700; padding:9px 16px; border-radius:999px; border:0; cursor:pointer; white-space:nowrap; background:{{ t.bg }}; color:{{ t.color }}\" sc-camel-on-click=\"{{ t.pick }}\">{{ t.label }}<\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <sc-if value=\"{{ tedTabHome }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"display:grid; grid-template-columns:repeat(auto-fit, minmax(min(100%, 320px), 1fr)); gap:20px; margin-top:20px; align-items:start\">\n          <div style=\"background:#C9F4F1; border-radius:28px; padding:22px\">\n              <div style=\"display:flex; justify-content:space-between; align-items:baseline; gap:4px 12px; flex-wrap:wrap\">\n                <h2 style=\"font-family:'Fredoka', 'Figtree', sans-serif; font-size:24px; font-weight:600; margin:0; color:#14786F\">⭐ Ted’s jobs<\u002Fh2>\n                <span style=\"font-size:13px; font-weight:700; color:#14786F\">{{ tedJobCount }}<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"display:grid; gap:6px; margin-top:12px\">\n                <span style=\"display:block; font-size:12px; font-weight:800; letter-spacing:.1em; text-transform:uppercase; color:#14786F; margin-top:4px\">🗓️ Every week<\u002Fspan>\n                <sc-for list=\"{{ tedWeekly }}\" as=\"r\" hint-placeholder-count=\"2\">\n                  <div style=\"display:flex; gap:10px; align-items:center; background:#fff; border-radius:14px; padding:9px 12px; opacity:{{ r.op }}\">\n                    <button type=\"button\" aria-label=\"Done\" style=\"flex:none; width:24px; height:24px; border-radius:50%; border:2px solid #7B4FD6; background:{{ r.fill }}; color:#fff; cursor:pointer; padding:0; font-size:13px; font-weight:800\" sc-camel-on-click=\"{{ r.toggle }}\">{{ r.mark }}<\u002Fbutton>\n                    <span style=\"flex:none; font-size:17px\">{{ r.emoji }}<\u002Fspan>\n                    <span style=\"flex:1; min-width:0; font-size:15.5px; font-weight:600; text-decoration:{{ r.deco }}\">{{ r.text }}<\u002Fspan>\n                    <span style=\"flex:none; font-size:11.5px; font-weight:800; padding:3px 8px; border-radius:999px; background:#EDE3FF; color:#5B3FA8\">{{ r.tag }}<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n                <span style=\"display:block; font-size:12px; font-weight:800; letter-spacing:.1em; text-transform:uppercase; color:#14786F; margin-top:4px\">🧹 Once a month<\u002Fspan>\n                <sc-for list=\"{{ tedMonthly }}\" as=\"r\" hint-placeholder-count=\"2\">\n                  <div style=\"display:flex; gap:10px; align-items:center; background:#fff; border-radius:14px; padding:9px 12px; opacity:{{ r.op }}\">\n                    <button type=\"button\" aria-label=\"Done\" style=\"flex:none; width:24px; height:24px; border-radius:50%; border:2px solid #7B4FD6; background:{{ r.fill }}; color:#fff; cursor:pointer; padding:0; font-size:13px; font-weight:800\" sc-camel-on-click=\"{{ r.toggle }}\">{{ r.mark }}<\u002Fbutton>\n                    <span style=\"flex:none; font-size:17px\">{{ r.emoji }}<\u002Fspan>\n                    <span style=\"flex:1; min-width:0; font-size:15.5px; font-weight:600; text-decoration:{{ r.deco }}\">{{ r.text }}<\u002Fspan>\n                    <span style=\"flex:none; font-size:11.5px; font-weight:800; padding:3px 8px; border-radius:999px; background:#EDE3FF; color:#5B3FA8\">{{ r.tag }}<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n                <span style=\"display:block; font-size:12px; font-weight:800; letter-spacing:.1em; text-transform:uppercase; color:#14786F; margin-top:4px\">⭐ Other jobs<\u002Fspan>\n                \n                <sc-for list=\"{{ tedJobs }}\" as=\"j\" hint-placeholder-count=\" 0; margin:6px 0 0; color:#3E2A7A\">{{ termTitle }}<\u002Fh2>\n              <p style=\"font-size:14.5px; line-height:1.5; margin:6px 0 0; color:#5B3FA8\">{{ termSub }}<\u002Fp>\n              <sc-if value=\"{{ inTerm }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"height:10px; border-radius:10px; background:rgba(255,255,255,.75); overflow:hidden; margin-top:12px\"><div style=\"height:100%; width:{{ termPct }}; border-radius:10px; background:#7B4FD6\"><\u002Fdiv><\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n        <\u002Fdiv>\n        <section style=\"margin-top:20px; background:#fff; border-radius:28px; padding:clamp(16px,2.4vw,24px); box-shadow:0 1px 0 var(--rule)\" aria-label=\"My week\">\n          <div style=\"display:flex; justify-content:space-between; align-items:baseline; gap:10px\"><h2 style=\"font-family:'Fredoka', 'Figtree', sans-serif; font-size:22px; font-weight:600; margin:0; color:#14786F\">📅 My week<\u002Fh2><span style=\"font-size:13px; font-weight:700; color:#6B5E86\">Big calendar below 👇<\u002Fspan><\u002Fdiv>\n          <div style=\"overflow-x:auto; -webkit-overflow-scrolling:touch; margin-top:12px; padding-bottom:4px\"><div style=\"display:grid; grid-template-columns:repeat(7, minmax(0,1fr)); gap:8px; min-width:560px\">\n            <sc-for list=\"{{ tedStrip }}\" as=\"d\" hint-placeholder-count=\"7\">\n              <div style=\"min-width:0; min-height:96px; padding:10px; border-radius:16px; background:{{ d.bg }}; box-shadow:{{ d.ring }}\">\n                <span style=\"display:block; font-size:11px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:#14786F\">{{ d.dow }}<\u002Fspan>\n                <span style=\"display:block; font-family:'Fredoka', 'Figtree', sans-serif; font-size:20px; font-weight:600; line-height:1.1\">{{ d.num }}<\u002Fspan>\n                <sc-for list=\"{{ d.items }}\" as=\"it\" hint-placeholder-count=\"1\"><span style=\"display:block; margin-top:5px;
